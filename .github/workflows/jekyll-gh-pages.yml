# CI/CD workflow for validating then deploying a Jekyll site to GitHub Pages
name: CI and Deploy Jekyll Site

on:
  # Run CI on main pushes
  push:
    branches: ["main"]

  # Run CI on pull requests targeting main
  pull_request:
    branches: ["main"]

  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Minimal default permissions; deploy job elevates as needed
permissions:
  contents: read

# Only one Pages workflow at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1) CI validation build and checks (must pass before any deploy build)
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build test site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./

          destination: ./_site_test

      - name: Validate generated routes and i18n output
        run: |
          set -euo pipefail

          # Expected language entrypoints
          test -f ./_site_test/fr/index.html
          test -f ./_site_test/en/index.html

          # Expected key pages
          test -f ./_site_test/fr/guides/index.html
          test -f ./_site_test/en/guides/index.html
          test -f ./_site_test/fr/troubleshooting/index.html
          test -f ./_site_test/en/troubleshooting/index.html

          # Fail if renderer fallback warning appears in built output
          if grep -R "Missing i18n content for ref" -n ./_site_test; then
            echo "i18n content is missing for at least one page ref"
            exit 1
          fi

          # Validate internal FR/EN links resolve to generated files
          mapfile -t links < <(
            grep -RhoE 'href="/(fr|en)/[^"#?]*([?#][^"]*)?"' ./_site_test/fr ./_site_test/en \
              | sed -E 's/^href="([^"]*)"$/\1/' \
              | sort -u || true
          )

          broken=0
          for link in "${links[@]}"; do
            clean="${link%%\#*}"
            clean="${clean%%\?*}"

            if [[ "$clean" == */ ]]; then
              target="./_site_test${clean}index.html"
            else
              target="./_site_test${clean}"
            fi

            if [[ ! -f "$target" && ! -f "${target}.html" ]]; then
              echo "Broken internal link: $link -> $target"
              broken=1
            fi
          done

          if [[ "$broken" -ne 0 ]]; then
            echo "One or more internal links are broken in generated FR/EN pages"
            exit 1
          fi

          # Ensure breadcrumb/navigation block is present on key pages
          for page in \
            ./_site_test/fr/index.html \
            ./_site_test/fr/guides/index.html \
            ./_site_test/fr/guides/pre-requis/index.html \
            ./_site_test/fr/troubleshooting/index.html \
            ./_site_test/en/index.html \
            ./_site_test/en/guides/index.html \
            ./_site_test/en/guides/prerequisites/index.html \
            ./_site_test/en/troubleshooting/index.html; do
            if ! grep -q 'class="page-nav"' "$page"; then
              echo "Missing breadcrumb/navigation block in $page"
              exit 1
            fi
          done

  # 2) Rebuild for deployment (only after test-build passes)
  build:
    needs: test-build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build production site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  # 3) Deploy to GitHub Pages
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
