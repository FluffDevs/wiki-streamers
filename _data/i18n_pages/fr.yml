    ## 5. Accueil

    Route : `/dashboard`.

    ### Si ton compte n'a que le rôle de base

    Tu vois uniquement : *« Bienvenue sur FluffRadio. Aucune section supplémentaire n'est associée à votre compte. »* Rien d'autre à faire sur cette page.

    ### Si ton compte a un rôle plus complet

    Tu vois, dans cet ordre :

    **1. Une grille de raccourcis** (une carte par domaine) :
    - **« Fichiers audio »** — *« Uploader, éditer et gérer la bibliothèque audio. »* — un bouton **+** t'amène directement sur la page Fichiers audio téléchargés.
    - **« Playlists »** — si tes playlists sont en cours de chargement : *« Chargement des playlists... »* ; s'il n'y en a aucune : *« Organiser les séquences musicales de diffusion. »* ; sinon, une liste cliquable des **5 premières playlists** avec leur nombre de pistes entre parenthèses (ex. « Sélection du vendredi soir (12 pistes) ») — cliquer dessus t'amène directement sur cette playlist dans la page Playlists. Un bouton **+** amène vers la page Playlists en général.
    - **« Programmations »** — *« Préparer les contenus à diffuser par créneau. »* — bouton **+** vers la page Programmations.
    - **« Cache »** — *« Inspecter et mettre à jour le cache des données. »* — bouton **+** vers la page Cache.

    **2. Le panneau de statut du serveur de diffusion** (visible aussi pour le groupe « Accès aux statuts ») — voir description détaillée au chapitre 12 (« AwooStatusPanel »), avec : version et temps de fonctionnement du serveur, statut du direct, piste en cours, un graphique de la mémoire utilisée sur les 5 dernières minutes, et (administrateurs uniquement) un bouton **« Passer »** pour sauter la piste automatique en cours.

    **3. Un bandeau explicite** : *« Section legacy (Icecast/Liquidsoap) — nécessite `ICECAST_STATUS_URL` / `LIQUIDSOAP_STATUS_URL`, non configurées actuellement. »* — cela t'informe que la section qui suit affiche des **données de secours/simulées**, pas les vraies statistiques (le vrai statut du serveur de diffusion est le panneau au-dessus, pas celui-ci).

    **4. Le panneau « Streaming Manager (Icecast + Liquidsoap) »** (legacy, à ignorer pour un usage courant) :
    - un badge **« On Air »** / **« Off Air »** ;
    - quatre boutons : **Start**, **Stop**, **Skip**, **Reload** — ils envoient une commande, mais tant que les variables techniques ci-dessus ne sont pas configurées, leur effet réel est limité/simulé ;
    - un encart « lecture en cours » (piste, artiste, débit, pic d'auditeurs) ;
    - des compteurs **Listeners** (auditeurs), **Bandwidth** (bande passante estimée), **Storage** (espace disque utilisé/total) ;
    - une liste **« Recently played »** (dernières pistes) ;
    - un graphique en barres **« Listeners trend »** (évolution du nombre d'auditeurs).

    > En résumé : pour connaître le vrai statut de diffusion, regarde le panneau du haut (AwooStatusPanel/LIVE STREAM) ; le bloc du bas est un ancien tableau de bord technique qui n'est pas branché sur l'infrastructure actuelle.

