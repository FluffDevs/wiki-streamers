    ## 6. Médiathèque

    Route : `/dashboard/mediatheque`. Accès : Administrateurs, Accès Médiathèque.

    Cette page sert **uniquement à consulter et écouter** le catalogue de musiques déjà validées — impossible d'uploader ou de modifier quoi que ce soit ici (pour ça, voir « Fichiers audio téléchargés » et « Validation musiques »).

    ### Ce que tu vois

    - Une barre de recherche.
    - Un sélecteur **« Grouper par »** avec quatre choix : **Artiste**, **Album**, **Genre**, **Année**. Les morceaux sont organisés en groupes repliables/dépliables selon ce choix (chaque groupe a une petite flèche à cliquer pour l'ouvrir/fermer).
    - Des filtres complémentaires (genre, langue).
    - Chaque piste possède ses propres contrôles de lecture intégrés directement dans la liste (lecture/pause, précédent/suivant, volume), sans passer par une fenêtre séparée.
    - Un badge **« E »** apparaît à côté du titre d'une piste marquée comme contenu explicite.

    ### Ce que tu ne peux pas faire ici

    Uploader un fichier, modifier des métadonnées, supprimer une piste : ces actions se font depuis « Fichiers audio téléchargés » (pour les admins et Uploader Radio) ou « Validation musiques » (admins).

    ---

    ## 7. Fichiers audio téléchargés

    Route : `/dashboard/fichiers-audio`. Accès : Administrateurs, Uploader Radio.

    Cette page a deux parties : un bloc d'upload en haut, et la liste du catalogue en dessous.

    ### 7.1 Uploader un ou plusieurs fichiers

    **Étape 1 — sélectionner les fichiers.** Zone de dépôt affichant *« Déposer des fichiers audio ici ou cliquer pour sélectionner »*, avec l'indication *« Sélection multiple · MP3, WAV, OGG, M4A, vidéo (podcasts) · max 25 fichiers »*. Tu peux :
    - glisser-déposer un ou plusieurs fichiers directement dans la zone ;
    - ou cliquer dessus pour ouvrir le sélecteur de fichiers de ton ordinateur (accepte les formats audio et vidéo).

    Un compteur en bas de la zone t'indique combien de places restent (*« X/25 fichiers sélectionnés · Y places restantes »*), ou *« Limite atteinte : 25/25 fichiers sélectionnés »* si tu es au maximum. Si tu essaies d'en ajouter plus que la limite, un message apparaît : *« Limite atteinte : vous ne pouvez pas ajouter plus de 25 fichiers. »* (ou, si certains passent quand même : *« Limite atteinte : seuls les 25 premiers fichiers seront pris en compte. »*).

    **Étape 2 — le règlement d'upload (obligatoire, une seule fois par navigateur).** La **toute première fois** que tu ouvres cette page (ou tant que tu n'as pas coché « se souvenir »), une fenêtre s'ouvre et **bloque tout le reste de la page** tant qu'elle est ouverte :
    - Titre : *« Règlement d'upload des titres »*.
    - Texte : *« Avant d'uploader des fichiers, merci de lire le règlement ci-dessous. Il détaille les règles à respecter pour les métadonnées, les droits et la qualité des titres soumis. »*
    - Bouton **« Ouvrir le règlement (PDF) »** : ouvre le document PDF officiel dans un nouvel onglet.
    - Tant que tu n'as pas cliqué sur ce bouton, tu vois : *« Ouvrez le règlement pour débloquer la case de confirmation ci-dessous. »* — et la case à cocher suivante reste **grisée, impossible à cocher**.
    - Une fois le PDF ouvert (même si tu ne le lis pas jusqu'au bout), le message devient : *« ✓ Règlement ouvert : vous pouvez confirmer sa lecture ci-dessous. »*, et la case se débloque.
    - Case à cocher 1 : **« J'ai bien lu et compris le règlement »** — doit être cochée pour continuer.
    - Case à cocher 2 (optionnelle) : **« Se souvenir de mon choix et ne plus afficher ce message »** — si cochée, la fenêtre ne réapparaîtra plus sur ce navigateur (l'information est gardée localement sur ton ordinateur/navigateur, pas sur ton compte — si tu changes d'ordinateur ou de navigateur, elle réapparaîtra).
    - Bouton **« Fermer »** : reste désactivé tant que la case 1 n'est pas cochée.

    **Étape 3 — les champs de chaque fichier.** Pour chaque fichier ajouté, une carte apparaît avec :
    - le nom du fichier et sa taille (en Ko ou Mo) ;
    - un statut : « En attente », « Upload... » (avec un anneau de progression individuel), « Réussi » (coché vert), ou « Erreur » (croix rouge, avec le message d'erreur affiché juste en dessous) ;
    - des champs pré-remplis automatiquement quand c'est possible :
      - **Titre** et **Artiste** : devinés depuis les informations intégrées au fichier (tags ID3), ou sinon depuis le nom du fichier s'il est écrit sous la forme « Artiste - Titre.mp3 » (sinon, seul le nom de fichier sert de titre) ;
      - **Album**, **Année**, **Genre** : devinés depuis les tags ID3 si présents ;
      - **Point de départ** : toujours pré-rempli à `0` ;
      - **Point de fin** : pré-rempli automatiquement à la durée totale détectée du fichier.
    - **Champ Titre*** (obligatoire, pour tous types de fichiers).
    - **Champ Artiste*** (obligatoire, pour tous types de fichiers).
    - **Champ Catégorie** :
      - Si tu es un compte **Uploader Radio simple** (non admin) : ce champ n'apparaît pas du tout, un champ figé affiche juste « Musiques » — tu ne peux uploader que des musiques.
      - Si tu es **administrateur** (ou tout compte avec le droit de choisir la catégorie) : un menu déroulant propose **Musiques**, **Jingles / habillage**, **Podcasts / préenregistrés**, **Promos / publicités**, **VOD / Rediffusions**, **Autres**. Si tu choisis autre chose que « Musiques », une note apparaît : *« Rangé dans la médiathèque « [catégorie] », pas dans les musiques. »*
    - **Champ Genre** : obligatoire (marqué d'une astérisque) uniquement si la catégorie est « Musiques » ; facultatif sinon (le label affiche alors « Genre (facultatif) »). Se remplit via un sélecteur de genre dédié (liste déroulante avec recherche parmi les genres normalisés, ou saisie libre pour un genre personnalisé).
    - **Champ Album*** : n'apparaît **que** pour la catégorie « Musiques », et y est obligatoire.
    - **Champ Année** : obligatoire pour « Musiques », facultatif sinon.
    - **Champ Langue** : obligatoire pour « Musiques » (menu déroulant avec les langues normalisées ; si tu choisis « Autre », un champ texte libre apparaît pour préciser), facultatif sinon.
    - **Champ Registre SACEM*** : n'apparaît **que** pour la catégorie « Musiques », et y est obligatoire. À côté du libellé, deux liens : **« Rechercher ce titre ↗ »** (ouvre une recherche pré-remplie sur le site de la SACEM à partir du titre et de l'artiste déjà saisis) et **« Répertoire SACEM ↗ »** (ouvre le répertoire général de la SACEM).
    - Case à cocher **« Contenu explicite »** (toujours facultative, quelle que soit la catégorie).
    - Case à cocher **« Contenu furry »** (toujours facultative, quelle que soit la catégorie — spécificité du site).
    - **Champ Point de départ (s)*** et **Point de fin (s)*** : toujours obligatoires, en secondes, quelle que soit la catégorie.
    - Si des champs obligatoires manquent pour ce fichier, un message rouge apparaît directement sous la carte : *« Champs obligatoires manquants : [liste des champs]. »*
    - Un bouton **« Retirer »** (icône poubelle) permet d'enlever ce fichier de la liste avant l'upload (impossible pendant que l'upload de ce fichier est en cours).

    **Étape 4 — lancer l'upload.** Le bouton **« Uploader N fichier(s) »** en bas :
    - reste **désactivé** tant qu'au moins un fichier de la liste a un champ obligatoire manquant (un texte au survol du bouton l'indique : *« Complète tous les champs obligatoires avant d'uploader »*) ;
    - pendant l'envoi, affiche *« Upload en cours... »* avec une icône animée, et une **barre de progression globale** (pourcentage, pondérée par la taille des fichiers) apparaît au-dessus de la liste.

    **Étape 5 — après l'upload.** Une fois tous les fichiers envoyés avec succès, la liste se vide automatiquement et un message apparaît en haut de page : *« N fichier(s) uploadé(s). Cliquez sur « Actualiser » pour les afficher. »* — **l'upload ne rafraîchit pas automatiquement la liste du catalogue en dessous**, il faut cliquer explicitement sur le bouton **« Actualiser »**.

    **Bouton « Vider »** : retire tous les fichiers actuellement dans la file d'attente (avant envoi), sans rien envoyer.

    ### 7.2 Gérer le catalogue existant

    En dessous du bloc d'upload :
    - Une barre de recherche : *« Rechercher par titre ou artiste... »*.
    - Un bouton **« Actualiser »** (avec une icône de rafraîchissement) recharge la liste complète depuis le serveur.
    - Chaque piste affiche : une icône de note de musique, son titre, son artiste (« Artiste inconnu » si absent), sa durée, sa date d'upload.
    - Boutons par piste :
      - **Lecture / Stop** (icône ronde) : joue la piste directement dans un lecteur qui apparaît en haut de la liste, avec un bouton Stop dédié.
      - **Modifier** (icône crayon, administrateurs uniquement) : ouvre une fenêtre de modification (voir ci-dessous).
      - **Supprimer** (icône poubelle, administrateurs uniquement) : demande confirmation (*« Confirmer la suppression ? »*) puis supprime **définitivement** la piste.
    - En bas : des contrôles de pagination (nombre de pistes par page, navigation).

    ### 7.3 La fenêtre « Corriger les métadonnées »

    Ouverte via le bouton Modifier (administrateurs uniquement). Contient :
    - Un bouton de lecture/arrêt directement dans l'en-tête de la fenêtre.
    - **Titre** (texte libre).
    - **Artiste**.
    - **Album** (facultatif).
    - **Genre** (sélecteur dédié).
    - **Année** (facultatif, uniquement des chiffres).
    - **Durée** : affichée en lecture seule, non modifiable (calculée automatiquement depuis le fichier).
    - **Langue** (menu déroulant + champ personnalisé si « Autre »).
    - Case **Contenu explicite**, case **Contenu furry**.
    - **Registre SACEM** (avec les mêmes liens d'aide que sur l'upload).
    - **Point de départ (s)** et **Point de fin (s)**.
    - L'identifiant technique de la piste est affiché en bas de la fenêtre (« ID : ... ») — utile si tu dois signaler un problème précis à un administrateur.
    - Bouton **« Annuler »** : ferme sans rien enregistrer.
    - Bouton **« Sauvegarder »** : reste désactivé tant qu'aucun champ n'a été réellement modifié ; en cas de succès, affiche *« Métadonnées mises à jour avec succès. »* et ferme la fenêtre.

    **Validations appliquées avant sauvegarde** (un message rouge s'affiche et rien n'est envoyé si l'une échoue) :
    - Année : doit être un nombre si renseignée (*« Année invalide : entrez une valeur numérique. »*).
    - Point de départ / fin : doivent être des nombres (secondes), avec ou sans décimales (*« Point de départ invalide : entrez uniquement des chiffres (secondes, >= 0). »* / idem pour le point de fin).
    - Le point de fin doit être strictement supérieur au point de départ (*« Le point de fin doit être supérieur au point de départ. »*).
    - Ni l'un ni l'autre ne peut dépasser la durée réelle de la piste (*« Le point de fin ne peut pas dépasser la durée de la piste ([durée]). »*).
    - Si aucun champ n'a changé : *« Aucune modification détectée. »* (le bouton Sauvegarder est de toute façon désactivé dans ce cas).

    **Important** : modifier les métadonnées d'une piste **ne change jamais son statut de validation** — une piste déjà validée reste validée après modification par un administrateur (le statut est explicitement préservé en coulisses).

    ### 7.4 Messages d'erreur possibles

    Toutes les actions de cette page (chargement, upload, suppression, sauvegarde) peuvent afficher un message d'erreur explicite en cas de problème, sous cette forme générale : *« [Action] : [session expirée ou non autorisée / accès refusé / introuvable côté serveur / erreur interne du serveur backend] — [détail]. »* Si tu vois « session expirée ou non autorisée », déconnecte-toi puis reconnecte-toi ; pour les autres cas, contacte un administrateur si le problème persiste.

    ---

    ## 8. Playlists

    Route : `/dashboard/playlists`. Accès : Administrateurs, Gestion Playlist.

    ### 8.1 Vue d'ensemble de l'écran

    L'écran est divisé en deux : une colonne de gauche (liste des playlists) et une zone principale à droite (contenu de la playlist sélectionnée).

    ### 8.2 Colonne de gauche

    - Titre **« Playlists »** avec un badge indiquant le nombre total.
    - Bouton **rafraîchir** (icône) : recharge la liste des playlists **et** le catalogue de musiques disponibles.
    - Bouton **+** : ouvre la fenêtre de création d'une nouvelle playlist.
    - Une barre de recherche par nom (n'apparaît que s'il existe déjà au moins une playlist).
    - La liste elle-même : chaque ligne affiche un avatar (première lettre du nom), le nom de la playlist, et son nombre de pistes. Un bouton **✕** sur chaque ligne (au survol) permet de la supprimer directement.
    - États particuliers :
      - Chargement en cours : *« Chargement... »*.
      - Aucune playlist du tout : *« Aucune playlist »* + *« Clique sur + pour en créer une »*.
      - Une recherche ne donne rien : *« Aucun résultat »* + *« Essaie un autre nom »*.

    ### 8.3 Créer une playlist

    Bouton **+** → fenêtre **« Nouvelle playlist »** :
    - Champ **Nom** (obligatoire, exemple affiché : « Sélection du vendredi soir »). Valider avec la touche Entrée fonctionne aussi.
    - Bouton **Annuler**.
    - Bouton **Créer** (grisé tant que le nom est vide ; affiche « Création... » pendant l'opération).

    La playlist créée apparaît immédiatement dans la liste, vide (0 piste).

    ### 8.4 Supprimer une playlist

    Clic sur le **✕** d'une ligne → fenêtre de confirmation : *« Supprimer « [nom] » ? »* avec le texte *« Cette action est irréversible : la playlist et son ordre de pistes seront définitivement supprimés. »* Boutons **Annuler** / **Supprimer** (affiche « Suppression... » pendant l'opération). Si la playlist supprimée était ouverte à l'écran, l'affichage revient à « Aucune playlist sélectionnée ».

    ### 8.5 Consulter et modifier le contenu d'une playlist

    En cliquant sur une playlist dans la liste de gauche, elle s'ouvre à droite avec :
    - Son nom en titre, et en dessous : *« N piste(s) · durée totale »* (la durée totale est calculée et affichée sous forme « 1h 23m » ou « 4m 05s »).
    - Bouton **« + Ajouter des musiques »** (voir §8.6).
    - Un **indicateur d'enregistrement automatique**, à droite, qui change d'état tout seul :
      - « ✓ Enregistré » (état normal/au repos) ;
      - « Modifications en attente... » (tu viens de faire un changement, l'enregistrement va se déclencher dans un instant) ;
      - « Enregistrement... » (envoi en cours) ;
      - « Échec — réessayer » (l'enregistrement automatique a échoué ; **cliquer sur cet indicateur relance manuellement la sauvegarde**).
    - La liste des pistes de la playlist, chacune avec :
      - un champ numérique modifiable indiquant sa **position** (tu peux taper directement un nouveau numéro et appuyer sur Entrée ou cliquer ailleurs pour déplacer la piste à cette position) ;
      - une poignée de **glisser-déposer** (icône à 6 points) pour réordonner à la souris ;
      - le titre (avec un badge **« E »** si contenu explicite), l'artiste, le genre (badge), et une ligne supplémentaire avec album/langue/année si connus, et une autre ligne indiquant les points de repère (« ▶ 0:00 – 3:12 » par exemple) si définis ;
      - la durée ;
      - un bouton **✕** pour retirer la piste de la playlist (ne supprime pas la piste du catalogue général, juste de cette playlist).
    - Si la playlist est vide : *« Cette playlist est vide »* + *« Ajoute des musiques pour commencer à construire l'ordre de diffusion »* + un bouton pour ajouter des musiques.
    - Des contrôles de pagination en bas de la liste des pistes si elle est longue.

    **Point important** : les modifications (ajout, retrait, réordonnancement) sont **enregistrées automatiquement** environ 1 seconde après ta dernière action (pas besoin de cliquer sur un bouton « Enregistrer » séparé). Si tu changes rapidement de playlist ou fermes l'onglet juste après un changement, attends de voir « Enregistré » pour être sûr que c'est bien pris en compte.

    ### 8.6 Ajouter des musiques à une playlist

    Bouton **« + Ajouter des musiques »** → une fenêtre plein écran s'ouvre : **« Ajouter des musiques à « [nom de la playlist] » »**.

    **Outils de recherche et de filtre**, tous combinables :
    - Barre de recherche texte (titre, artiste, album).
    - Menu **« Tous les artistes »** → liste de tous les artistes présents dans le catalogue.
    - Menu **« Tous les genres »** → liste de tous les genres présents.
    - Menu **« Toutes les langues »**.
    - Menu **« Tous les albums »**.
    - Menu **« Explicite : indifférent »** → « Explicite seulement » ou « Non explicite seulement ».
    - Plage **Année** : deux champs Min / Max.
    - Plage **Durée (min)** : deux champs Min / Max, en minutes.
    - Bouton **« Réinitialiser »** (n'apparaît que si au moins un filtre est actif) : remet tous les filtres à zéro d'un coup.

    **Sélection et ajout** :
    - Case **« Tout sélectionner (N) »** en haut : coche/décoche toutes les musiques **qui correspondent aux filtres actifs** (pas forcément toutes les musiques du catalogue si un filtre est en place).
    - Chaque ligne de résultat a sa propre case à cocher, et un bouton **+** individuel à droite (coche verte si le morceau est déjà dans la playlist — le bouton devient alors désactivé avec l'infobulle « Déjà dans la playlist »).
    - Bouton **« Ajouter à la playlist (N) »** : ajoute d'un coup toutes les musiques actuellement cochées.
    - Note : seules les musiques **déjà validées par un administrateur** apparaissent dans cette liste (voir chapitre 11 « Validation musiques »).
    - Tant que le contenu actuel de la playlist n'a pas fini de se charger, les boutons d'ajout restent désactivés avec l'infobulle *« Chargement de la playlist en cours... »* — patiente quelques instants.

    Bouton **« Terminé (N piste(s)) »** en bas ferme la fenêtre (les ajouts sont déjà pris en compte, pas besoin de « valider » séparément).

    ### 8.7 D'où vient l'auteur d'une playlist ?

    Le champ « auteur » d'une playlist se remplit automatiquement avec ton adresse email (déduite de ton compte de connexion) — tu n'as rien à saisir toi-même.

    ---

    ## 9. Programmations

    Route : `/dashboard/programmations`. Accès : Administrateurs, Programmeurs Radio.

    C'est l'écran le plus complexe de l'outil : il construit le planning complet de diffusion de la radio.

    ### 9.1 Vue d'ensemble

    En haut de page :
    - **Navigation par semaine** : flèches ◀ / ▶ pour changer de semaine, un libellé central « Semaine du [jour] [mois] », et un bouton **« Aujourd'hui »** qui n'apparaît que si tu n'es pas sur la semaine courante.
    - **« Repli (aucun créneau) »** : un menu déroulant pour choisir la **playlist de secours**, celle qui joue automatiquement quand aucun créneau n'est programmé à un instant donné. Choix « — aucun — » possible (dans ce cas, silence si rien n'est programmé).
    - Bouton **« Enregistrer »** (en haut à droite) : sauvegarde l'intégralité du planning affiché. Rien n'est envoyé au serveur tant que tu ne cliques pas dessus, **sauf** que chaque case du planning se met à jour dans ton navigateur immédiatement après validation d'un créneau (voir §9.3) — mais tant que tu n'as pas cliqué sur « Enregistrer », personne d'autre ne voit ces changements et un rechargement de page les perdrait.

    Juste en dessous, un aperçu en direct :
    - **« En ce moment »** : le titre et le contenu du créneau actuellement diffusé (avec sa priorité), ou « — rien — » si aucun créneau ne couvre l'instant présent.
    - **« Ensuite »** : le titre du prochain créneau et son heure de début, ou « — rien — ».

    ### 9.2 La grille hebdomadaire

    Une grille à 7 colonnes (Lundi à Dimanche) et 24 lignes d'heures (00:00 à 23:00, subdivisées par demi-heure).

    - **Cliquer sur une case vide** ouvre la fenêtre de création d'un nouveau créneau, pré-rempli avec le jour et l'heure de cette case.
    - **Cliquer sur un bloc coloré déjà présent** ouvre ce créneau en modification.
    - Chaque bloc affiche : ses horaires (« 14:00–16:00 »), sa priorité (« · P50 »), une petite icône représentant son type, et son titre.
    - Un créneau **désactivé** (voir §9.3, case « Actif ») apparaît visuellement grisé/estompé dans la grille, mais reste cliquable pour modification.
    - Si deux créneaux de priorités différentes se chevauchent visuellement, celui de priorité la plus haute s'affiche par-dessus l'autre.

    ### 9.3 Créer ou modifier un créneau — tous les champs en détail

    **Type de créneau** — menu déroulant avec 7 choix, chacun pré-remplissant une priorité par défaut et déterminant les champs suivants :

    | Type de créneau | Priorité par défaut | Ce que tu choisis ensuite |
    |---|---|---|
    | Playlist | 1 | une playlist |
    | Playlist alternée | 1 | deux sources ou plus qui alternent |
    | Émission — direct | 50 | un animateur |
    | Émission — préenregistrée | 50 | un seul fichier de la catégorie « Podcasts » |
    | Habillage / virgule | 25 | un seul fichier de la catégorie « Jingles » |
    | Promotion | 75 | un seul fichier de la catégorie « Promos » |
    | VOD / Rediffusion | 50 | un seul fichier de la catégorie « VOD » |

    Changer le type recalcule automatiquement la priorité par défaut (tu peux toujours l'ajuster ensuite) et vide les champs de contenu déjà choisis s'ils ne correspondent plus.

    **Priorité** — curseur de 0 à 100, avec la valeur actuelle affichée entre parenthèses et un rappel de la valeur par défaut du type choisi. Texte d'aide affiché en permanence : *« Priorité plus haute = passe devant en cas de chevauchement. Deux créneaux actifs de même priorité qui se chevauchent sont refusés à l'enregistrement. »*

    **Titre** — champ texte, obligatoire.

    **Récurrence** — trois choix possibles :
    - **Toutes les semaines** : le créneau revient chaque semaine, sur les jours cochés ci-dessous.
    - **Une semaine sur N** : demande un champ supplémentaire **« Une semaine sur »** (nombre entre 2 et 8), et un champ **« Semaine de référence (première diffusion) »** (une date). Le cycle est compté à partir du **lundi de la semaine que tu choisis comme référence** — texte d'aide : *« Le cycle est compté à partir du lundi de cette semaine, comme le serveur de diffusion — pas de notion de semaine « paire / impaire ». »*
    - **Ponctuel (une date)** : un seul champ **Date** apparaît ; pas de jours de la semaine à cocher ; ce créneau ne se reproduit jamais et apparaît dans la liste séparée « Événements ponctuels » (§9.7).

    **Jours** (récurrent uniquement) — cases à cocher Lundi à Dimanche, au moins une doit être cochée.

    **Début** / **Fin** — deux sélecteurs d'heure. Texte d'aide affiché en permanence : *« L'heure de fin est la fenêtre du créneau, pas une coupure : le changement se fait à la fin du morceau en cours. »* — et, sauf pour un direct : *« « Max boucles » renseigné = travail dû, rattrapé s'il démarre en retard ; vide = remplissage, abandonné à la fin de la fenêtre. »*

    **Champs spécifiques selon le type choisi :**

    - **Type « Playlist »** :
      - menu **Playlist** (obligatoire) ;
      - case **« Lecture aléatoire »** ;
      - champ **« Max boucles (optionnel) »** : nombre entier ≥ 1. Vide = la playlist joue en boucle indéfiniment tant que la fenêtre horaire n'est pas finie (du remplissage, sacrifiable). Une valeur = un nombre de tours précis à faire (du contenu jugé important, rattrapé même en cas de retard de démarrage).

    - **Type « Émission — direct »** :
      - menu **Animateur** (obligatoire) — si la liste est vide, message : *« Aucun animateur chargé — crée-les dans « Streamers & direct ». »*
      - Texte d'aide permanent : *« Un créneau direct ne joue aucun média : laisser une playlist de fond en dessous n'est pas un conflit, c'est le filet si le direct ne démarre pas. »* — c'est-à-dire qu'il est normal et recommandé de superposer une playlist à priorité plus basse sous chaque créneau de direct, pour que quelque chose joue automatiquement si l'animateur ne se connecte pas.

    - **Types média (Émission préenregistrée, Habillage, Promotion, VOD)** :
      - un menu **« Catégorie de médiathèque »** est affiché mais **déjà pré-rempli et cohérent avec le type choisi** (tu peux le changer, mais ce n'est en général pas nécessaire) ;
      - **un seul fichier** à choisir (pas de liste) : une zone de recherche affiche les résultats sous forme de lignes cliquables (titre, artiste, genre, durée) — cliquer sur une ligne sélectionne ce fichier ;
      - **choisir un fichier recalcule automatiquement l'heure de fin** du créneau, pour qu'elle corresponde exactement à la durée réelle du fichier (l'heure de début ne bouge pas, seule la fin s'ajuste) ;
      - si la catégorie choisie est « Musiques », une note précise : *« seules les pistes validées par un admin sont proposées »* ;
      - une fois choisi, le nom du fichier sélectionné s'affiche sous le sélecteur ;
      - champ **« Max boucles (optionnel) »** disponible aussi ici.

    - **Type « Playlist alternée »** :
      - Texte d'aide : *« Au moins deux sources. À chaque tour, la playlist joue « [nombre] » éléments puis on passe à la suivante. Chaque source garde sa position et son budget de boucles ; l'ensemble n'est rattrapable que si toutes les sources ont un « Max boucles ». »*
      - Chaque **source** (au moins 2, tu peux en ajouter d'autres) a :
        - un type : **Playlist** ou **Liste d'audios** ;
        - **« Nombre joué d'affilée »** : combien d'éléments de cette source jouent avant de passer à la source suivante (par exemple : 3 musiques, puis 1 jingle, puis retour à 3 musiques...) ;
        - si type Playlist : un sélecteur de playlist ;
        - si type Liste d'audios : un sélecteur de catégorie de médiathèque, puis une recherche multi-sélection (tu peux ajouter plusieurs fichiers à cette source, chacun listé avec un **✕** pour le retirer) ;
        - case **« Lecture aléatoire »** ;
        - champ **« Max boucles (optionnel) »** ;
        - un bouton **« Retirer »** apparaît sur chaque source dès qu'il y en a plus de 2 (impossible de descendre en dessous de 2 sources).
      - Bouton **« + Ajouter une source »** pour en ajouter d'autres.

    **Description** — champ texte libre, facultatif, multi-lignes.

    **Case « Actif »** — décochée, le créneau reste enregistré mais n'est jamais diffusé (utile pour préparer un créneau à l'avance, ou suspendre temporairement une émission sans la supprimer).

    **Boutons du bas de la fenêtre :**
    - **« Supprimer »** (uniquement si tu modifies un créneau existant, pas pour une création) : retire immédiatement ce créneau du planning affiché (à confirmer ensuite en cliquant sur « Enregistrer » en haut de la page pour que ce soit définitif).
    - **« Annuler »** : ferme la fenêtre sans rien garder.
    - **« Valider »** : vérifie et applique tes changements **dans l'affichage local** (pas encore envoyé au serveur — il faut ensuite cliquer sur « Enregistrer » en haut de la page).

    ### 9.4 Ce qui bloque la validation d'un créneau (messages d'erreur)

    Avant même d'envoyer quoi que ce soit au serveur, en cliquant sur **« Valider »** :
    - *« Le titre est requis. »*
    - *« Choisis au moins un jour. »* (récurrent sans aucun jour coché)
    - *« La fin doit être après le début. »*
    - *« Choisis une playlist. »* (type Playlist sans playlist choisie)
    - *« Choisis un animateur. »* (type Direct sans animateur choisi)
    - *« Ajoute au moins un audio. »* (type média sans fichier choisi)
    - *« Une alternance demande au moins deux sources. »*
    - *« Chaque source « playlist » doit désigner une playlist. »*
    - *« Chaque source « audios » doit contenir au moins un audio. »*
    - *« « Nombre joué d'affilée » doit être au moins 1. »*
    - Si, après validation, ton créneau (actif) chevauche dans le temps un autre créneau actif de la **même priorité exacte** : *« Chevauchement avec un créneau de priorité [N] : [titres des créneaux en conflit]. Donne-leur des priorités différentes (la plus haute gagne). »* — la validation est bloquée tant que ce n'est pas résolu (change la priorité de l'un des deux créneaux, ou désactive-en un).

    ### 9.5 Enregistrer le planning complet

    Cliquer sur **« Enregistrer »** en haut de page déclenche plusieurs vérifications, dans l'ordre :

    1. **Recherche de tout chevauchement de même priorité** dans l'ensemble du planning (pas seulement le créneau que tu viens de modifier) — si un conflit existe n'importe où, l'enregistrement est refusé avec le message *« Des créneaux actifs de même priorité se chevauchent — le backend les refusera. Donne des priorités distinctes. »* et une liste détaillée des paires en conflit apparaît en dessous.
    2. **Validation de forme** de tout le document — en cas de souci technique (rare), *« La programmation ne respecte pas le format attendu — rien n'a été envoyé. »* avec le détail.
    3. **Envoi au serveur.** Réponses possibles :
       - Succès : *« Programmation enregistrée. Elle sera prise en compte à l'antenne dans les 30 minutes au plus. »* — **retiens bien ce délai : un changement enregistré n'est jamais instantané sur l'antenne**, il peut mettre jusqu'à une demi-heure à être pris en compte par le serveur de diffusion.
       - **Conflit de version** (quelqu'un d'autre a enregistré entre-temps) : *« Conflit : la programmation a été modifiée entre-temps (v...). Rechargement... »* — la page recharge automatiquement la dernière version ; **tes modifications non enregistrées depuis ce rechargement sont perdues**, il faut les refaire après le rechargement.
       - **Droit insuffisant** : *« Ton compte n'a pas le droit de modifier la programmation. »*
       - Autre erreur : le message renvoyé par le serveur, avec le détail des champs en cause si disponible.

    ### 9.6 Un message qui peut apparaître au chargement de la page

    *« N créneau(x) récurrent(s) recalé(s) sur une ancre cohérente (ancien modèle « semaine paire/impaire »). Enregistre pour figer. »* — cela signifie que d'anciens créneaux, créés avec un système de récurrence différent (aujourd'hui abandonné), ont été automatiquement réinterprétés de façon équivalente. **Clique sur « Enregistrer » pour que cette réinterprétation devienne définitive** ; sinon, elle sera recalculée à chaque chargement de page (sans conséquence pratique tant que tu n'as touché à rien, mais mieux vaut figer).

    Si la programmation ne peut pas du tout être chargée depuis le serveur : *« Programmation indisponible ([détail]) — brouillon local, l'enregistrement échouera. »* — tu peux quand même consulter/préparer des créneaux dans cet état, mais rien ne pourra être sauvegardé tant que la connexion au serveur n'est pas rétablie.

    ### 9.7 Les listes en bas de page

    - **« Événements ponctuels (N) »** : uniquement les créneaux à date unique (non récurrents), triés par date. Un bouton **« + Ponctuel »** en crée un nouveau directement.
    - **« Tous les créneaux (N) »** : l'intégralité des créneaux, avec une barre de recherche (« Rechercher (titre, playlist, animateur…) »), triés par priorité décroissante puis par titre. Chaque ligne affiche : le type de récurrence en texte, les horaires, une icône représentant le type, le titre, une description du contenu (nom de playlist / animateur / fichier(s)), et la priorité. Cliquer sur une ligne ouvre ce créneau en modification (identique à cliquer sur son bloc dans la grille).

    ### 9.8 Pied de page

    Un rappel discret en bas de l'écran : *« Connecté en tant que [ton nom] — heures affichées en Europe/Paris, converties en UTC à l'enregistrement · version [n° de version] »*.

    ---

    ## 10. Habillage d'antenne

    Route : `/dashboard/habillage-antenne`. Accès : Administrateurs, Programmeurs Radio, Streamers.

    Cette page permet de parcourir, écouter, télécharger et (pour les administrateurs) modifier tous les fichiers de la médiathèque **en dehors du flux d'upload principal des Musiques** — bien qu'elle donne aussi accès à la catégorie Musiques par commodité.

    ### 10.1 Structure de l'écran

    - Une rangée d'onglets, un par catégorie : **Musiques**, **Jingles / habillage**, **Podcasts / préenregistrés**, **Promos / publicités**, **VOD / Rediffusions**, **Autres**. L'onglet ouvert par défaut est « Jingles / habillage ».
    - Une barre de recherche (titre, artiste, genre).
    - Un tableau avec, par ligne : des boutons d'action (Écouter, Télécharger, et Modifier pour les admins), le titre, l'artiste, le genre.
    - Si un onglet n'a jamais été ouvert, son contenu se charge la première fois que tu cliques dessus (pas tout chargé d'avance).
    - Message si la catégorie est vide : *« Aucun élément dans cette catégorie (ou endpoint indisponible). »*
    - Message si une recherche ne donne rien mais que la catégorie contient des éléments : *« Aucun élément. »*

    ### 10.2 Actions par ligne

    - **Écouter** (icône lecture/stop) : lance la lecture. Un lecteur apparaît, **collé en bas de l'écran** (visible même en faisant défiler la page), avec le titre/artiste de la piste en cours et les contrôles audio standards du navigateur. Cliquer à nouveau sur le bouton de la même ligne l'arrête.
    - **Télécharger** : télécharge le fichier sur ton ordinateur, avec un nom de fichier lisible (titre + bonne extension) plutôt que l'identifiant technique brut.
    - **Modifier** (icône crayon, administrateurs uniquement) : ouvre une fenêtre avec les champs **Titre**, **Artiste**, **Genre** pour toutes les catégories, plus **Album**, **Année**, **Langue**, **Registre SACEM** uniquement si la catégorie active est « Musiques ». Boutons **Annuler** / **Enregistrer**.

    ### 10.3 En cas de problème de lecture ou de téléchargement

    Si le serveur renvoie une réponse inattendue (JSON ou page d'erreur au lieu du fichier audio), le message *« Le serveur a renvoyé une réponse inattendue (pas un fichier audio). »* s'affiche — cela signale généralement un souci technique côté serveur, pas une erreur de ta part ; réessaie, et si ça persiste, préviens un administrateur.

    ### 10.4 Note de bas de page

    *« Connecté en tant que [ton nom]. Lecture et téléchargement passent par le cache S3 ; rien n'est stocké côté navigateur en dehors du fichier téléchargé. »* — autrement dit, écouter un fichier ici ne le sauvegarde nulle part sur ton ordinateur ; seul un clic explicite sur « Télécharger » enregistre réellement un fichier chez toi.

    ---

    ## 11. Validation musiques

    Route : `/dashboard/validation-musiques`. Accès : **Administrateurs uniquement.**

    C'est ici que passent **exclusivement les musiques** (catégorie « Musiques ») en attente d'un premier examen après upload — les autres catégories (jingles, podcasts, promos, VOD, autres) n'ont pas cette étape et sont utilisables immédiatement après upload.

    ### 11.1 Fonctionnement général

    - Une barre de recherche (titre, artiste).
    - Une fiche par piste en attente, chacune avec un lecteur intégré (bouton Écouter dans l'en-tête, qui affiche le lecteur audio juste en dessous).
    - L'en-tête de chaque fiche affiche : le titre, l'artiste, l'identifiant technique de la piste, et éventuellement la page de cache où elle est indexée.
    - Message si aucune piste n'est en attente : *« Aucune piste à valider. »*
    - Contrôles de pagination en bas si la liste est longue.

    ### 11.2 Les champs modifiables sur chaque fiche

    - **Titre** (pré-rempli avec la valeur uploadée).
    - **Artiste**.
    - **Album** (facultatif à ce stade — contrairement à l'upload, ce champ n'est pas obligatoire pour valider).
    - **Genre** (sélecteur dédié, facultatif).
    - **Année** (facultatif, chiffres uniquement).
    - **Langue** (menu déroulant + champ personnalisé si « Autre », facultatif).
    - **Durée** : lecture seule.
    - **Registre SACEM** (facultatif, avec les mêmes liens d'aide SACEM que sur l'upload).
    - **Point de départ (s)** / **Point de fin (s)** (facultatifs à ce stade).
    - Case **Contenu explicite**, case **Contenu furry**.

    > Contrairement à ce qu'on pourrait penser, la validation **n'exige que le Titre et l'Artiste** comme champs obligatoires — les autres (album, genre, année, langue, SACEM, points de repère) peuvent être laissés vides si tu choisis de valider sans les compléter. Bien sûr, il est recommandé de les vérifier/compléter avant de valider, mais l'outil ne t'y oblige pas techniquement, hormis Titre/Artiste.

    ### 11.3 Les deux actions possibles

    - **Bouton « Valider »** (coche verte) : enregistre les champs tels qu'affichés sur la fiche et marque la piste comme validée. Elle disparaît alors immédiatement de cette liste, et apparaîtra désormais dans Médiathèque et sera sélectionnable dans Programmations et lors de l'ajout à une playlist. Message de confirmation : *« « [titre] » validée. »*
      - Vérifications avant validation : Titre et Artiste non vides (*« Titre et artiste sont obligatoires avant validation. »*), Année/points de repère numériques si renseignés, point de fin strictement supérieur au point de départ si les deux sont renseignés.
    - **Bouton « Refuser »** (croix rouge) : demande confirmation — *« Refuser et supprimer définitivement « [titre] » ? »* — puis, si confirmé, **supprime le fichier et sa fiche pour toujours**. Ce n'est **pas** un simple retour à l'expéditeur ni une mise de côté : la piste est effacée du serveur. Message de confirmation : *« « [titre] » refusée et supprimée. »*

    ### 11.4 Un détail technique à connaître

    Juste après avoir validé ou refusé une piste, il se peut qu'elle réapparaisse brièvement dans la liste si tu rafraîchis très vite (le cache du serveur met quelques secondes à se mettre à jour) — l'outil s'en protège en interne en masquant toute piste déjà traitée pendant cette session, mais un rafraîchissement manuel complet de la page (F5) pourrait la faire réapparaître un court instant ; ce n'est pas une erreur, patiente quelques secondes et réactualise à nouveau si besoin.

    ---

    ## 12. Streamers (animateurs et direct)

    Route : `/dashboard/streamers`. Accès : Administrateurs, Streamers.

    Cette page a jusqu'à trois blocs, selon ton rôle : la liste des animateurs (admin), ta propre fiche (si tu es toi-même animateur), et le contrôle du direct (visible par tous ceux qui ont accès à la page).

    ### 12.1 Bloc « Animateurs » (administrateurs uniquement)

    Un tableau de tous les comptes animateurs existants, avec ces colonnes : **Identifiant**, **Titre à l'antenne**, **Dernier direct**, **Secrets rotés le**. Un badge d'alerte rouge apparaît devant l'identifiant de tout compte **désactivé**.

    Actions par ligne :
    - **Éditer** : ouvre la fiche complète en modification.
    - **Icône clé** : ouvre directement la fenêtre des secrets de connexion (voir §12.4).
    - **Direct** : présélectionne cet animateur dans le panneau « Direct » plus bas sur la même page.

    Note en bas du tableau : *« La liste ne porte pas les modes / l'état « désactivé » : ils s'affichent en ouvrant la fiche (qui renvoie aussi les secrets). »*

    **Bouton « Nouvel animateur »** ouvre une fenêtre de création :
    - **Compte Cognito** : si des comptes existent dans le groupe Streamers ou Administrateurs et ne sont pas déjà des animateurs, un menu déroulant les propose (avec email et nom si connus) ; texte d'aide : *« L'identifiant animateur doit être exactement le nom d'utilisateur Cognito pour que l'animateur puisse gérer son propre direct. »* Si aucun compte disponible (tous déjà animateurs, ou aucun compte dans ces groupes, ou impossible de charger la liste), un champ texte libre apparaît à la place, avec l'exigence : 32 caractères maximum, lettres/chiffres/tiret/underscore uniquement.
    - **Modes autorisés** : cases à cocher **SRT** et **RTMP** (au moins un doit être coché).
    - **Chiffrement SRT** : menu déroulant (None, AES-128, AES-192, AES-256).
    - **Fin de direct** : menu déroulant avec quatre choix — *« Coupé à la fin du créneau »*, *« 5 min de rab puis coupé »*, *« 15 min de rab puis coupé »*, *« Jamais coupé automatiquement »*.
    - **Titre à l'antenne** (facultatif).
    - Case **« Autoriser un direct hors créneau »**.
    - Case **« Compte désactivé »**.
    - Boutons **Annuler** / **Enregistrer**.

    Après création ou modification, un bandeau confirme : *« Animateur créé. »* ou *« Animateur mis à jour. »*

    ### 12.2 Bloc « Ma fiche animateur »

    Visible pour **tout le monde**, y compris les administrateurs (un administrateur peut être lui-même animateur sans forcément avoir le groupe Streamers).

    - Si tu as une fiche animateur : elle affiche ton identifiant, tes modes autorisés, ton niveau de chiffrement SRT, ta politique de fin de direct, si tu peux diffuser hors créneau, et une ligne cliquable « Secrets — changé le [date] — voir » qui ouvre la fenêtre des secrets.
    - Si tu n'en as pas (et que tu n'es pas administrateur) : *« Aucune fiche animateur rattachée à « [ton nom] ». Demande à un admin de la créer. »*
    - Si l'accès à ta fiche est explicitement refusé (par exemple compte désactivé) : le message d'erreur exact renvoyé par le serveur s'affiche.

    ### 12.3 Bloc « Direct »

    Affiche en permanence (mis à jour toutes les 5 secondes) :
    - **« À l'antenne : »** le nom de l'animateur actuellement en direct, ou « — personne — », avec la précision « (connecté) » ou « (pas encore connecté) ».
    - Le **mode** (SRT ou RTMP) et le chiffrement si SRT.
    - Si RTMP : l'URL est scindée en deux lignes copiables séparément — **« Serveur »** et **« Clé de flux »** (chacune avec un bouton **Copier**, qui devient « Copié ! » brièvement après le clic) — c'est le format attendu par un logiciel comme OBS.
    - Si SRT (ou un autre format d'URL) : une seule ligne **« URL d'ingest »**, copiable.
    - Le titre de flux et la politique de fin de direct de l'animateur en cours, si connus.
    - Si le serveur de diffusion lui-même signale un problème : un bandeau rouge avec le message technique exact.

    **Formulaire de démarrage/arrêt** (visible si tu es administrateur, ou si tu as toi-même une fiche animateur) :
    - **Animateur** : menu déroulant (admin) ou champ figé avec ton propre nom (non-admin).
    - **Mode** : SRT ou RTMP (les modes proposés dépendent de ce que l'animateur choisi est autorisé à utiliser).
    - **Chiffrement (session, non enregistré)** : uniquement si mode SRT — permet de forcer un niveau de chiffrement différent de celui enregistré sur la fiche, juste pour cette session, sans modifier la fiche.
    - **Titre à l'antenne (optionnel)** : si vide, le titre du créneau programmé est utilisé à la place.
    - **Forcer (couper l'autre)** : case à cocher, **administrateurs uniquement** — permet de reprendre la main sur un ingest déjà ouvert par quelqu'un d'autre.

    Boutons : **Arrêter** (toujours visible) et **Démarrer / armer** (visible seulement si tu as le droit d'agir sur cet animateur).

    **Une distinction technique importante à connaître (indiquée en note de bas de section)** :
    > *« SRT : l'ingest ne s'arme jamais en avance — il s'arme automatiquement 10 minutes avant le début du créneau, jamais avant. Rien à cliquer : « Démarrer » ne fait que récupérer l'URL déjà ouverte. RTMP : rien n'est pré-armé, il faut « Démarrer » soi-même. Ne relance pas si la réponse dit « déjà en place ». « connecté » faux juste après un démarrage n'est pas un échec. »*

    En clair :
    - En **SRT**, le système ouvre lui-même la connexion 10 minutes avant l'heure prévue du créneau — cliquer sur « Démarrer / armer » ne fait alors que **récupérer** l'URL déjà générée, ce n'est pas toi qui déclenches l'ouverture.
    - En **RTMP**, rien ne s'ouvre automatiquement : c'est à toi de cliquer sur « Démarrer / armer » au moment voulu.
    - Un message *« Ingest déjà en place — ne relance pas le démarrage, l'URL existante est renvoyée »* n'est pas une erreur — inutile de recliquer.
    - Voir la mention « (pas encore connecté) » ou « connecté » à `false` juste après un démarrage est **normal** : la connexion effective (le logiciel de streaming qui se branche réellement) prend quelques secondes.
    - Si l'ingest est déjà tenu par quelqu'un d'autre : *« Ingest déjà ouvert pour [nom]. »*, suivi de *« Coche « Forcer » pour reprendre l'antenne. »* (admin) ou *« Un admin peut forcer. »* (non-admin).

    ### 12.4 La fenêtre « Secrets »

    Ouverte depuis l'icône clé (liste admin) ou depuis « Ma fiche animateur ».

    - Avertissement permanent : *« Ne les partage pas, ne les mets pas dans une URL publique. Régénérer coupe la validité des URL d'ingest ; si l'animateur est à l'antenne, il faudra ré-armer son direct (force, admin). »*
    - Si l'animateur concerné est **actuellement en direct**, un bandeau supplémentaire apparaît avec l'URL (ou Serveur+Clé) **en cours d'utilisation**, copiable — c'est la seule façon de la retrouver si tu l'as perdue pendant que le direct est actif.
    - **Secret SRT** et **Secret RTMP** : affichés en lecture seule (cliquer dans le champ sélectionne tout le texte pour faciliter la copie), chacun avec son bouton Copier. Note technique en bas : *« Les secrets seuls ne suffisent pas à se connecter : l'URL complète (port compris) n'existe que pendant une session active — elle s'affiche ci-dessus quand [animateur] est à l'antenne, ou dans le panneau « Direct » après un « Démarrer / armer ». »*
    - Bouton **« Fermer »**.
    - Bouton **« Régénérer »** (rouge, dangereux) : fait tourner **les deux secrets en même temps**. Confirmation implicite par l'avertissement affiché — **il n'y a pas de seconde fenêtre de confirmation**, clique dessus seulement si tu es sûr. Une fois régénérés, les anciens identifiants ne fonctionnent plus **immédiatement**, même si l'animateur était en cours de diffusion (il faudra qu'un administrateur relance son direct avec l'option « Forcer »).

