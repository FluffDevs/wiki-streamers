    ## 13. Debug API

    Route : `/dashboard/debug-api`. Accès : **Administrateurs uniquement.**

    Un outil **technique**, destiné au support et au diagnostic — pas à un usage quotidien de programmation ou d'édition.

    - Des dizaines de requêtes prédéfinies, groupées par domaine (planning public, programmations, animateurs, direct, utilisateurs, médiathèque, playlists, cache/streaming legacy), exécutables une par une.
    - Un bouton pour lancer en une fois tous les GET/HEAD (requêtes de lecture seule, donc sans risque).
    - Un bouton pour lancer **tous** les préréglages d'un coup, y compris ceux qui **modifient réellement des données** (créer un animateur de test, faire tourner des secrets, supprimer une musique) — une fenêtre de confirmation s'affiche avant de lancer, car cela peut avoir des effets réels et gênants si utilisé sans réfléchir.
    - Un décodeur du jeton de connexion actuel (JWT) et du profil OIDC, pour vérifier ce que ton compte porte réellement comme informations/groupes.
    - Une validation automatique de certaines réponses contre les schémas de données attendus, avec le détail de ce qui ne correspond pas si un souci est détecté.
    - Un constructeur de requête personnalisée (méthode, chemin, corps, activer/désactiver l'authentification) pour tester un appel précis.

    **Utilise cette page uniquement si tu sais ce que tu fais ou sous la conduite d'un développeur** — plusieurs actions y sont réellement destructrices.

    ---

    ## 14. Cache (journal des requêtes)

    Route : `/dashboard/cache`. Accès : **Administrateurs uniquement.**

    > Le nom de cette page dans le menu (« Cache ») est trompeur : elle n'affiche **pas** un outil de gestion de cache, mais un **journal des requêtes réseau** faites par l'application elle-même.

    - Chaque ligne du journal correspond à un appel que le panel a fait à ses propres routes internes depuis que tu as ouvert cette page (ou depuis le dernier vidage) : méthode, URL, statut de réponse, durée.
    - En cliquant sur une ligne, elle se déplie et montre le détail complet : en-têtes et corps de la requête envoyée, en-têtes et corps de la réponse reçue. **Tout jeton d'authentification est automatiquement masqué**, il n'apparaît jamais en clair ici.
    - Un filtre permet de restreindre l'affichage par méthode ou par URL.
    - Bouton **« Vider le journal »** : efface tout l'historique affiché (ne supprime rien côté serveur, juste l'affichage local).
    - Le journal est **entièrement local à cette page ouverte** : il repart de zéro à chaque rechargement ou fermeture de la page — il n'est jamais partagé avec quelqu'un d'autre ni conservé quelque part.

    **Utilité typique** : un administrateur qui essaie de comprendre pourquoi une action « ne s'enregistre pas » peut ouvrir cette page, refaire l'action problématique ailleurs dans un autre onglet, puis revenir ici pour voir exactement quelle requête a été envoyée et ce que le serveur a répondu.

