home:
  body: |
    # Wiki Streamers Fluff Radio

    Ce wiki explique comment configurer OBS pour diffuser sur le serveur Fluff Radio.

    Objectif: vous donner une procedure fiable, reproductible et securisee pour passer en direct.

    ## Versions de langue

    - Francais: [Accueil FR](/fr/)
    - English: [Home EN](/en/)

    ## Parcours rapide

    1. Lire les pre-requis (ton mode SRT ou RTMP)
    2. Recuperer ton lien de connexion depuis le panel
    3. Configurer OBS
    4. Lancer son stream
    5. Consulter le troubleshooting en cas de probleme

    ## Ce que vous trouverez ici

    - Un guide de configuration sans valeur arbitraire: vous appliquez uniquement les valeurs validees par votre equipe technique.
    - Des checklists pre-live, live et post-live.
    - Une methode de diagnostic en cas d'echec de connexion, freeze, perte audio ou desynchronisation.
    - Une methode d'escalade avec les bons elements a fournir (logs, symptomes, horodatage).

    ## Navigation

    - [Guides de configuration](/fr/guides/)
    - [Pre-requis](/fr/guides/pre-requis/)
    - [Identifiants de diffusion](/fr/guides/identifiants-diffusion/)
    - [Configurer OBS](/fr/guides/configurer-obs/)
    - [Lancer son stream](/fr/guides/lancer-le-live/)
    - [Troubleshooting](/fr/troubleshooting/)
    - [Panel d'administration (staff)](/fr/panel-admin/) — guide complet du panel `programmation.fluffradio.com` (médiathèque, playlists, programmations, validation, streamers...)

    ## Notes importantes

    - Ne jamais partager ses identifiants de diffusion (secrets/passphrase).
    - Ces identifiants sont uniques par streamer et se recuperent exclusivement depuis le panel.
    - En cas de regeneration des secrets par un administrateur, mettre a jour OBS immediatement.
    - Toujours tester avant un direct public, meme pour un changement mineur.

    ## Demarrage rapide (5 minutes)

    1. Verifier internet + audio + scene principale.
    2. Recuperer ton lien depuis le panel (automatique 10 min avant en SRT, ou "Demarrer / armer" en RTMP) et le configurer dans OBS.
    3. Lancer un test prive de 60 a 120 secondes.
    4. Verifier les stats OBS (debit stable, zero erreurs critiques).
    5. Demarrer le live.

guides-home:
  body: |
    # Guides de configuration

    Parcours recommande:

    1. [Pre-requis](/fr/guides/pre-requis/)
    2. [Identifiants de diffusion](/fr/guides/identifiants-diffusion/)
    3. [Configurer OBS](/fr/guides/configurer-obs/)
    4. [Lancer son stream](/fr/guides/lancer-le-live/)

    ## Logique du parcours

    - Les pre-requis limitent les risques techniques avant configuration.
    - Les identifiants valident l'authentification au serveur RTMP.
    - La configuration OBS stabilise qualite et performance.
    - Le guide de lancement encadre le direct et la gestion d'incident.

    ## Conseil de maintenance

    Apres un live stable, sauvegarder votre profil OBS de reference et ne modifier les reglages qu'hors direct.

    [Retour a l'accueil](/fr/)

prerequisites:
  body: |
    # Pre-requis

    Avant toute chose, deux notions a comprendre : le mode de diffusion de ton compte, et l'acces au panel d'administration (`programmation.fluffradio.com`). Tout le reste de ce wiki en decoule.

    ## Les deux modes de diffusion

    Fluff Radio supporte deux protocoles. Ton compte n'est autorise qu'a un ou plusieurs modes precis, configures par un administrateur.

    - **SRT** (mode par defaut et recommande) : particularite essentielle a retenir, **ton lien de connexion s'ouvre tout seul, automatiquement, 10 minutes avant le debut de ton creneau programme**. Rien a demarrer manuellement.
    - **RTMP** (mode de repli, pour un logiciel qui ne sait pas faire de SRT) : contrairement au SRT, rien ne s'ouvre automatiquement. C'est toi qui dois cliquer sur « Demarrer / armer » dans le panel au moment voulu.

    Retiens cette regle simple :

    > **SRT = automatique, 10 minutes avant. RTMP = manuel, tu cliques toi-meme.**

    ## Acceder au panel

    1. Ouvre `programmation.fluffradio.com`.
    2. Clique sur « Se connecter », saisis ton identifiant et ton mot de passe.
    3. Va dans le menu « Streamers » (barre de gauche). Si tu ne le vois pas, ton compte n'a pas encore le bon role — demande a un administrateur de te l'ajouter.

    ## Ta fiche animateur

    Sur la page « Streamers », un bloc « Ma fiche animateur » t'est reserve. Il affiche ton identifiant, tes modes autorises, ton niveau de chiffrement SRT, ta politique de fin de direct (voir [Lancer son stream](/fr/guides/lancer-le-live/)), et si tu peux diffuser hors creneau.

    - Si ce bloc dit qu'aucune fiche n'est rattachee a ton compte : demande a un administrateur de t'en creer une. Sans elle, impossible de passer a l'antenne.
    - Si l'acces est refuse : ton compte animateur existe mais a ete desactive. Contacte un administrateur.

    ## Materiel et connexion

    - Connexion internet stable (idealement ethernet)
    - Micro fonctionnel, casque recommande pour eviter le larsen
    - OBS Studio (ou logiciel equivalent supportant RTMP et/ou SRT selon ton mode), a jour

    ### Conseils pratiques

    - Eviter le Wi-Fi si possible pour reduire les pertes de paquets.
    - Fermer les applications qui consomment fortement le reseau pendant le live.
    - Redemarrer la machine avant un direct important ; eviter les mises a jour systeme juste avant.

    ## Verification rapide avant un direct

    1. Ouvrir OBS, verifier que la scene principale est prete.
    2. Verifier que le micro capte du son sans saturer.
    3. Ouvrir la page « Streamers » du panel pour verifier ton mode et ton acces.
    4. Si ton creneau approche (SRT), garder la page ouverte : le lien apparaitra tout seul 10 minutes avant.

    [Etape suivante : recuperer ses identifiants](/fr/guides/identifiants-diffusion/)

credentials:
  body: |
    # Recuperer son lien de connexion

    Ce lien (ou tes identifiants Serveur + Cle) se recupere **exclusivement depuis le panel** (`programmation.fluffradio.com`, page « Streamers »), jamais par un autre canal.

    ## Cas 1 : tu es en SRT avec un creneau programme (le cas normal)

    Rien a declencher toi-meme. A partir de 10 minutes avant l'heure de debut de ton creneau, le systeme ouvre automatiquement la connexion de son cote.

    1. Ouvre la page « Streamers » du panel a l'approche de ton creneau (ou avant, l'info se met a jour toute seule, rafraichie toutes les 5 secondes).
    2. Dans le bloc « Direct », ton lien « URL d'ingest » est deja pret, avec un bouton « Copier ».
    3. Cliquer sur « Demarrer / armer » a ce stade ne demarre rien de nouveau : ca ne fait que te redonner le lien deja ouvert. Tu peux cliquer sans crainte.
    4. Copie ce lien dans ton logiciel de streaming (voir [Configurer OBS](/fr/guides/configurer-obs/)).

    Si le bloc affiche encore « A l'antenne : — personne — » alors que tu es a moins de 10 minutes de ton creneau, patiente une minute et actualise la page.

    ## Cas 2 : tu es en RTMP, ou tu veux diffuser hors creneau

    Dans ces deux cas, rien ne s'ouvre automatiquement — c'est toi qui declenches la connexion, dans le bloc « Direct » de la page « Streamers » :

    1. Le champ Animateur affiche deja ton nom (fixe).
    2. Choisis le Mode (si plusieurs sont autorises pour ton compte).
    3. Si SRT : tu peux forcer un niveau de chiffrement different pour cette seule session (non enregistre).
    4. Renseigne un titre a l'antenne si tu veux (sinon, celui de ton creneau programme est utilise).
    5. Clique sur « Demarrer / armer ».
    6. Le lien (ou Serveur + Cle de flux) apparait dans le meme bloc.

    Diffuser hors creneau n'est possible que si un administrateur a explicitement autorise ton compte a le faire. Si le bouton reste inactif, c'est probablement la raison.

    Si un message dit « Ingest deja ouvert pour [quelqu'un d'autre] » : une autre personne diffuse deja. Un administrateur peut forcer la reprise si necessaire ; toi seul(e) ne peux pas.

    ## Bonnes pratiques de securite

    - Ne jamais partager ce lien, ni tes secrets, avec qui que ce soit.
    - Ne jamais afficher la fenetre de configuration OBS avec le lien/la cle visible pendant un direct filme ou partage d'ecran.
    - Le lien affiche dans le panel n'est valable que pendant une session active : perdu une fois la session terminee, il faut en recuperer un nouveau (armement automatique au prochain creneau, ou nouveau clic sur « Demarrer / armer »).
    - En cas de doute sur une fuite de tes secrets, demande **immediatement** a un administrateur de les regenerer depuis la fenetre « Secrets » de ta fiche animateur. Une regeneration invalide immediatement les anciens identifiants ; si tu es en direct au moment de la regeneration, ta diffusion en cours n'est pas coupee physiquement, mais un administrateur devra ensuite relancer ton direct avec l'option « Forcer » pour te redonner un lien valable.

    [Etape suivante : Configurer OBS](/fr/guides/configurer-obs/)

configure-obs:
  body: |
    # Configurer OBS

    Cette page explique la configuration minimale pour connecter OBS au serveur de diffusion.

    Objectif: obtenir un flux stable, audible et synchronise, sans imposer de valeurs techniques non validees.

    ## 1. Ouvrir les parametres de stream

    Dans OBS:

    1. Aller dans `Parametres`
    2. Ouvrir l'onglet `Stream`
    3. Choisir `Service: Custom...` (ou equivalent selon version)

    ## 2. Entrer les informations de diffusion

    Le format depend du mode de ton compte (voir [Pre-requis](/fr/guides/pre-requis/)) — les deux se recuperent depuis la page « Streamers » du panel, voir [Recuperer son lien de connexion](/fr/guides/identifiants-diffusion/).

    ### En RTMP

    L'information est scindee en deux parties separees et copiables independamment dans le panel :

    - `Server` : colle la valeur « Serveur » affichee dans le panel.
    - `Stream Key`: colle la valeur « Cle de flux » affichee dans le panel.

    ### En SRT

    Tu recois une URL complete unique (pas de separation Serveur/Cle) — colle-la telle quelle dans le champ de connexion SRT de ton logiciel (le champ exact depend de la version d'OBS ou du plugin SRT utilise).

    ### Bonnes pratiques de saisie

    - Utiliser copier/coller depuis le panel, jamais une valeur notee a la main.
    - Eviter les espaces ou retours a la ligne caches.
    - Le lien n'est valable que pendant une session active : si tu le perds, retourne le chercher dans le panel plutot que d'en reutiliser un ancien.
    - Re-valider apres toute regeneration de secrets par un administrateur.

    ## 3. Parametres de sortie recommandes (base)

    - Encodeur: materiel si disponible (NVENC/AMF/QuickSync), sinon x264
    - Bitrate video: valeur fournie par l'equipe technique
    - Audio: AAC 128 ou 160 kbps
    - Intervalle d'image cle (keyframe): 2 secondes

    ### Pourquoi ces parametres comptent

    - Encodeur: impacte charge machine et qualite percue.
    - Bitrate: trop haut = instabilite reseau; trop bas = artefacts visuels.
    - Audio: un son propre est souvent percu comme plus important que l'image.
    - Keyframe: indispensable pour compatibilite et recuperation apres pertes reseau.

    ### Controles a faire

    1. Surveiller l'usage CPU/GPU pendant un test.
    2. Verifier l'absence de messages d'encodage surcharge.
    3. Verifier la lisibilite de la scene dans un lecteur de controle.

    ## 4. Parametres video recommandes (base)

    - Resolution de base: selon votre scene
    - Resolution de sortie: 1920x1080 ou 1280x720 selon contraintes
    - FPS: 30 (ou 60 si valide par l'equipe)

    ### Strategie de stabilite

    - Prioriser la stabilite plutot que la performance maximale.
    - Si des pertes apparaissent, reduire d'abord FPS ou resolution de sortie.
    - Changer un seul parametre a la fois pour isoler l'effet.

    ## 5. Test avant direct

    1. Lancer un test hors antenne
    2. Verifier la stabilite du bitrate
    3. Verifier la synchro audio/video
    4. Verifier le retour son

    ## 6. Methodes de verification conseillees

    1. Test court (60-120 s): valide connexion et credentials.
    2. Test long (10-15 min): detecte chauffe, saturation, pertes intermittentes.
    3. Relecture d'enregistrement local (si active): controle qualite percue.
    4. Validation croisee: une autre personne confirme son/image en reception.

    ## 7. Erreurs frequentes a eviter

    - Changer plusieurs reglages juste avant de partir en direct.
    - Oublier de sauvegarder un profil OBS stable.
    - Lancer le live sans verifier les niveaux micro.
    - Reutiliser une passphrase d'un autre compte streamer.

    ## 8. Quand escalader vers le support

    Escalader si:

    - Les echecs de connexion persistent apres verification URL + passphrase.
    - Les pertes reseau sont recurrentes sur plusieurs tests.
    - L'encodage sature meme avec une configuration allegee.

    Fournir:

    1. Horodatage du test
    2. Capture des reglages stream/sortie/audio
    3. Log OBS exporte
    4. Description courte du symptome observe

    [Etape suivante: Lancer son stream](/fr/guides/lancer-le-live/)

go-live:
  body: |
    # Lancer son stream

    ## Check-list avant lancement

    - Scenes OBS pretes
    - Audio micro et audio desktop verifies
    - Lien/identifiants correctement renseignes dans OBS (voir [Configurer OBS](/fr/guides/configurer-obs/))
    - Connexion internet stable
    - Page « Streamers » du panel ouverte pour verifier ton statut

    ### Verifications de derniere minute

    - Verifier que la bonne scene est en `Preview` (si mode Studio).
    - Verifier que les alertes/overlays critiques sont actifs.
    - Verifier que le micro principal n'est pas mute hardware.
    - Verifier qu'aucune fenetre privee ne peut etre capturee accidentellement.

    ## Lancement

    - **En SRT avec un creneau programme** : rien a « lancer » cote panel — ton lien s'est deja ouvert automatiquement 10 minutes avant (voir [Recuperer son lien de connexion](/fr/guides/identifiants-diffusion/)). Renseigne-le dans OBS puis clique simplement sur `Demarrer le stream` dans OBS.
    - **En RTMP, ou hors creneau** : clique d'abord sur « Demarrer / armer » dans le panel pour obtenir ton lien, renseigne-le dans OBS, puis clique sur `Demarrer le stream` dans OBS.
    - Dans les deux cas, verifier le retour du panel : le badge « A l'antenne » passe a « (connecte) » une fois la connexion reellement etablie. Voir « (pas encore connecte) » juste apres le lancement est normal, ca ne dure que quelques secondes.

    ## Pendant le live

    - Surveiller les `Stats` OBS (images perdues, debit)
    - Garder un oeil sur les niveaux audio
    - Eviter les changements techniques majeurs pendant une sequence sensible

    ### Signaux a surveiller en priorite

    - Chute brutale du debit effectif
    - Erreurs reseau qui se repetent
    - Pics CPU/GPU persistants
    - Decalage audio progressivement visible

    ## Reactions rapides en incident live

    1. Basculer vers une scene de secours si necessaire.
    2. Reduire un cran de complexite (resolution/FPS/charge scene).
    3. Informer l'audience de la situation en restant clair.
    4. Noter l'heure exacte de l'incident pour faciliter l'analyse apres live.

    ## Fin de creneau : ce qui se passe automatiquement

    Ta fiche animateur porte un reglage « Fin de direct », choisi par un administrateur, qui determine ce qui se passe si tu es encore en train de diffuser quand l'heure de fin de ton creneau programme arrive :

    - **Coupe a la fin du creneau** : coupure automatique pile a l'heure prevue.
    - **5 min de rab puis coupe** : 5 minutes de battement avant coupure automatique.
    - **15 min de rab puis coupe** : 15 minutes de battement avant coupure automatique.
    - **Jamais coupe automatiquement** : c'est a toi (ou a un administrateur) de terminer le direct manuellement.

    Ce systeme ne coupe jamais un direct en cours sans raison : la coupure automatique n'intervient que pour un creneau reellement termine, jamais pour liberer l'antenne pendant que tu diffuses encore dans les temps.

    ## Terminer son direct soi-meme

    Que ce soit avant ou apres l'heure de fin prevue, tu peux couper ton propre direct a tout moment, sans condition liee au planning : va sur la page « Streamers », bloc « Direct », clique sur « Arreter ». Un message confirme « Direct coupe. » (ou « Rien n'etait ouvert. » si rien n'etait en cours — sans risque).

    ## Fin de live (cote OBS)

    1. Cliquer sur `Arreter le stream` dans OBS
    2. Cliquer sur « Arreter » dans le panel (page Streamers) si ce n'est pas deja fait automatiquement par ta politique de fin de direct
    3. Sauvegarder les modifications de scene si necessaire
    4. Signaler tout incident technique pour suivi

    ## Post-live technique recommande

    1. Noter ce qui a bien/mal fonctionne.
    2. Sauvegarder un profil OBS stable de reference.
    3. Archiver les logs en cas d'incident.
    4. Planifier les corrections hors plage de direct.

    [Voir le troubleshooting](/fr/troubleshooting/)

troubleshooting-home:
  body: |
    # Troubleshooting

    Si le stream ne part pas ou si la qualite est mauvaise, commencer ici.

    Methode recommandee:

    1. Isoler le symptome principal
    2. Verifier les causes les plus probables
    3. Appliquer une correction unique
    4. Re-tester avant de changer autre chose

    ## Problemes courants

    - [OBS n'arrive pas a se connecter au serveur](/fr/troubleshooting/problemes-courants/#obs-narrive-pas-a-se-connecter-au-serveur)
    - [Le stream freeze ou saccade](/fr/troubleshooting/problemes-courants/#le-stream-freeze-ou-saccade)
    - [Pas de son micro](/fr/troubleshooting/problemes-courants/#pas-de-son-micro)
    - [Audio desynchronise](/fr/troubleshooting/problemes-courants/#audio-desynchronise)

    ## Bonnes pratiques de diagnostic

    - Ne modifier qu'un parametre a la fois.
    - Noter heure, action appliquee et resultat.
    - Garder des captures des reglages avant/apres.

    ## Escalade

    Si le probleme persiste apres verification:

    1. Faire une capture d'ecran des parametres OBS stream/sortie/audio/video
    2. Exporter les logs OBS
    3. Contacter l'equipe technique avec heure et symptomes

    ## Qualite minimale pour reprise live

    - Connexion stable au serveur
    - Audio intelligible sans saturation
    - Flux video fluide sans freeze recurrent

    [Ouvrir la page problemes courants](/fr/troubleshooting/problemes-courants/)

common-issues:
  body: |
    # Problemes courants

    ## Je ne vois toujours pas de lien alors que mon creneau approche

    - Verifie que ton compte est bien en mode **SRT** (le RTMP ne s'arme jamais automatiquement, il faut cliquer toi-meme sur « Demarrer / armer », voir [Recuperer son lien de connexion](/fr/guides/identifiants-diffusion/)).
    - Si tu es bien en SRT, patiente : l'armement se fait pile a 10 minutes avant le debut, pas avant. Actualise la page « Streamers » du panel.

    ## Un message dit que l'ingest est deja ouvert pour quelqu'un d'autre

    Une autre personne diffuse deja en ce moment. Attends qu'elle ait termine, ou contacte un administrateur s'il y a une urgence justifiant de forcer la reprise (« Forcer » n'est disponible que pour les administrateurs).

    ## Le panel affiche « pas encore connecte » alors que j'ai lance ma diffusion

    Normal pendant quelques secondes le temps que la connexion s'etablisse techniquement. Si ca persiste plus d'une minute, verifie ta configuration OBS (mode, lien exact) ou contacte un administrateur.

    ## J'ai perdu mon lien / mes identifiants ne fonctionnent plus

    - Si ton direct est toujours actif, ouvre la fenetre « Secrets » depuis ta fiche animateur : l'URL en cours d'utilisation y est affichee et copiable.
    - Sinon, seul un administrateur peut te redonner tes identifiants ou les regenerer. Une regeneration invalide immediatement les anciens.

    ## Mon compte semble bloque / desactive

    Contacte un administrateur : seul lui peut reactiver ton compte animateur.

    ## OBS n'arrive pas a se connecter au serveur

    Verifier:

    - Le lien/les identifiants ont bien ete recuperes **depuis le panel** juste avant (pas une ancienne valeur reutilisee)
    - Bon champ pour le bon mode : Serveur+Cle separes en RTMP, une seule URL en SRT (ne pas les melanger)
    - Connexion internet operationnelle
    - Pare-feu/antivirus qui bloque OBS

    Diagnostic complementaire:

    - Verifier que le mode choisi dans OBS correspond au mode recupere dans le panel (SRT vs RTMP).
    - Verifier que les secrets n'ont pas ete regeneres entre-temps par un administrateur.
    - Verifier que l'heure systeme est correcte.

    Actions:

    1. Retourner sur la page « Streamers » du panel et copier-coller a nouveau le lien/les identifiants
    2. Redemarrer OBS
    3. Tester depuis un autre reseau si possible
    4. Contacter un administrateur si le probleme persiste

    ## Le stream freeze ou saccade

    Verifier:

    - Bitrate trop eleve pour votre upload
    - CPU/GPU satures
    - Images perdues reseau dans les stats OBS

    Diagnostic complementaire:

    - Verifier si la saturation est continue ou par pics.
    - Comparer comportement en scene simple vs scene lourde.
    - Verifier si les freezes coincident avec alertes, transitions ou captures navigateur.

    Actions:

    1. Baisser la resolution de sortie
    2. Baisser le bitrate
    3. Passer en 30 FPS
    4. Fermer les applications lourdes
    5. Simplifier temporairement overlays/filtres pour isoler la cause

    ## Pas de son micro

    Verifier:

    - Bonne source micro selectionnee
    - Mute desactive
    - Gain correct
    - Permissions OS micro autorisees

    Diagnostic complementaire:

    - Verifier si le micro fonctionne dans une autre application.
    - Verifier qu'aucune interface audio externe n'a change de profil.
    - Verifier le monitoring pour detecter un bruit mais niveau trop faible.

    Actions:

    1. Re-selectionner le peripherique micro
    2. Tester le micro hors OBS
    3. Relancer OBS
    4. Re-creer la source micro si la source semble corrompue

    ## Audio desynchronise

    Verifier:

    - Delai audio configure par erreur
    - Charge machine trop elevee

    Diagnostic complementaire:

    - Verifier si le decalage est constant ou augmente dans le temps.
    - Comparer sortie live et enregistrement local.
    - Verifier la presence de traitements audio lourds en temps reel.

    Actions:

    1. Remettre les delais audio a zero
    2. Reduire la charge encodage
    3. Refaire un test court avant reprise live

    ## Collecte de logs utile pour support

    1. Exporter le log OBS du test en echec.
    2. Noter l'heure exacte des symptomes.
    3. Joindre captures des onglets `Stream`, `Sortie`, `Audio`, `Video`.
    4. Decrire ce qui a deja ete tente pour eviter les repetitions.

    [Retour au troubleshooting](/fr/troubleshooting/)


admin-guide:
  body: |
    # Guide utilisateur complet — Panel d'administration FluffRadio

    > Ce guide décrit **absolument tout** ce que l'on peut voir et faire dans le panel d'administration FluffRadio (`programmation.fluffradio.com`), champ par champ, bouton par bouton, message par message. L'objectif : que tu n'aies jamais besoin de demander « comment on fait ça ? » — si une question te vient en lisant, c'est qu'un chapitre manque, dis-le.

    ## Sommaire

    1. [Avant de commencer : les concepts clés](#1-avant-de-commencer--les-concepts-clés)
    2. [Se connecter et se déconnecter](#2-se-connecter-et-se-déconnecter)
    3. [La structure commune à toutes les pages](#3-la-structure-commune-à-toutes-les-pages)
    4. [Qui a accès à quoi (rôles et groupes)](#4-qui-a-accès-à-quoi-rôles-et-groupes)
    5. [Accueil](#5-accueil)
    6. [Médiathèque](#6-médiathèque)
    7. [Fichiers audio téléchargés](#7-fichiers-audio-téléchargés)
    8. [Playlists](#8-playlists)
    9. [Programmations](#9-programmations)
    10. [Habillage d'antenne](#10-habillage-dantenne)
    11. [Validation musiques](#11-validation-musiques)
    12. [Streamers (animateurs et direct)](#12-streamers-animateurs-et-direct)
    13. [Debug API](#13-debug-api)
    14. [Cache (journal des requêtes)](#14-cache-journal-des-requêtes)
    15. [Glossaire](#15-glossaire)
    16. [Questions fréquentes / dépannage](#16-questions-fréquentes--dépannage)

    ---

    ## 1. Avant de commencer : les concepts clés

    Quelques notions reviennent partout dans l'outil. Les comprendre une fois évite bien des questions ensuite.

    - **Catégorie de médiathèque.** Chaque fichier audio (ou vidéo) appartient à exactement une catégorie : **Musiques**, **Jingles / habillage**, **Podcasts / préenregistrés**, **Promos / publicités**, **VOD / Rediffusions**, ou **Autres**. La catégorie détermine où le fichier apparaît, quels champs sont obligatoires à l'upload, et comment on le retrouve dans Programmations.
    - **Validation.** Seule la catégorie **Musiques** passe par un circuit de validation (page « Validation musiques ») : un morceau uploadé n'est utilisable dans Programmations et visible en Médiathèque qu'une fois validé par un administrateur. Les autres catégories (jingles, podcasts, promos, VOD, autres) n'ont **pas** ce circuit — elles sont utilisables dès l'upload.
    - **Créneau (slot).** Une case du planning de diffusion : un jour/heure, une durée, un type de contenu (playlist, direct, un fichier, une alternance), et une priorité.
    - **Priorité.** Un nombre de 0 à 100 attaché à chaque créneau. Si deux créneaux se chevauchent dans le temps, celui avec la priorité la plus haute est diffusé. Deux créneaux actifs à la **même** priorité qui se chevauchent sont **interdits** — le système refuse de les enregistrer tant que tu ne changes pas l'un des deux.
    - **Animateur.** Un compte technique séparé d'un compte de connexion au panel — il porte les identifiants de connexion (secrets) utilisés par un logiciel de streaming (OBS, etc.) pour émettre en direct. Un utilisateur humain peut être « lié » à un animateur du même nom.
    - **Direct / ingest.** La connexion technique qu'un animateur ouvre pour diffuser en direct, en RTMP ou en SRT.
    - **UTC / fuseau horaire.** En interne, toutes les heures sont stockées en temps universel (UTC). Le panel affiche et fait saisir les heures en **heure de Paris**, et convertit automatiquement — tu n'as jamais à faire cette conversion toi-même.

    ---

    ## 2. Se connecter et se déconnecter

    ### Se connecter

    1. Ouvre `programmation.fluffradio.com`. La page d'accueil publique s'affiche.
    2. Clique sur **« Se connecter »**.
    3. Tu es redirigé vers la page de connexion sécurisée (Cognito, le service d'identité utilisé par FluffRadio). Saisis ton identifiant et ton mot de passe.
    4. Une fois connecté, tu es automatiquement ramené sur `/dashboard` (l'accueil du panel).

    ### Cas particuliers à la connexion

    - **Tu ouvres une page du panel sans être connecté** : au lieu du contenu de la page, tu vois un message « Vous n'êtes pas connecté » avec un bouton **« Se connecter »**.
    - **Tu es connecté mais ton compte n'a pas le droit d'accéder à cette page précise** : tu vois **« Accès refusé — Votre groupe IAM ne permet pas d'accéder à cette page »**, avec un bouton **« Retour au dashboard »** qui t'amène vers la première page que ton compte peut effectivement consulter.
    - **Erreur d'authentification** (rare, souvent un souci temporaire du service de connexion) : un message « Erreur d'authentification : [détail technique] » s'affiche à la place de la page. Réessaie de recharger ; si ça persiste, préviens un administrateur.

    ### Se déconnecter

    Clique sur **« Déconnexion »**, visible en haut à droite de la barre du tableau de bord sur n'importe quelle page. Tu es immédiatement déconnecté et renvoyé vers la page de connexion.

    ---

    ## 3. La structure commune à toutes les pages

    Une fois connecté, chaque page du tableau de bord (`/dashboard/...`) partage exactement la même ossature :

    - **Barre latérale gauche** :
      - le logo FluffRadio ;
      - une carte **« LIVE STREAM »** qui affiche en permanence ce qui joue actuellement à l'antenne (chargée depuis le serveur de diffusion, mise à jour automatiquement toutes les 5 secondes), avec un badge de couleur indiquant l'état :
        - vert / « EN DIRECT » : quelqu'un diffuse en direct en ce moment ;
        - une autre couleur / « READY » : le système est prêt mais rien de spécial en cours (lecture automatique normale) ;
        - grisé / « HORS LIGNE » : le serveur de diffusion ne répond pas ;
      - les liens de navigation — **tu ne vois que les pages auxquelles ton compte a accès** (voir chapitre 4). Si une page mentionnée dans ce guide n'apparaît pas dans ta barre latérale, ton compte n'y a simplement pas droit ; ce n'est pas un bug.
    - **Barre du haut** : une étiquette « FluffRadio Admin », ton nom (ou ton email si aucun nom n'est renseigné sur ton compte), et le bouton **« Déconnexion »**.
    - **Zone de contenu** : le titre de la page et son contenu propre, décrit chapitre par chapitre ci-dessous.

    Un **fil d'ariane / titre de page** en haut de la zone de contenu te rappelle toujours où tu es.

    ---

    ## 4. Qui a accès à quoi (rôles et groupes)

    Ton compte appartient à un ou plusieurs **groupes**, attribués par un administrateur. Ce sont ces groupes qui déterminent ce que tu vois :

    | Groupe | Nom affiché dans ce guide |
    |---|---|
    | `admins` | Administrateurs — accès à tout, sans exception |
    | `AccesMediatheque` | Accès Médiathèque |
    | `GestionPlaylist` | Gestion Playlist |
    | `ProgrammeursRadio` | Programmeurs Radio |
    | `StaffRadio` | Staff Radio (rôle de base, donné à tout le monde) |
    | `UploaderRadio` | Uploader Radio |
    | `Streamers` | Streamers |
    | `AccesAuxStatus` | Accès aux statuts |

    ### Table complète des accès par page

    | Page | Groupes qui y ont accès |
    |---|---|
    | Accueil | Tout le monde (StaffRadio suffit) |
    | Médiathèque | Administrateurs, Accès Médiathèque |
    | Fichiers audio téléchargés | Administrateurs, Uploader Radio |
    | Playlists | Administrateurs, Gestion Playlist |
    | Programmations | Administrateurs, Programmeurs Radio |
    | Habillage d'antenne | Administrateurs, Programmeurs Radio, Streamers |
    | Validation musiques | Administrateurs **uniquement** |
    | Streamers | Administrateurs, Streamers |
    | Debug API | Administrateurs **uniquement** |
    | Cache | Administrateurs **uniquement** |

    **Si ton compte n'a que le rôle de base** (Staff Radio, sans aucun autre groupe), la page Accueil affiche uniquement un message de bienvenue neutre, sans aucun widget ni contrôle — c'est normal, ce n'est pas une erreur de chargement.

    **Un groupe spécial, « Accès aux statuts »**, donne uniquement le droit de voir le panneau de statut du serveur de diffusion sur la page d'accueil (version, mémoire, direct en cours…) en lecture seule, sans les autres widgets ni le bouton de contrôle (Skip) réservé aux administrateurs.

    **Des vérifications plus fines existent à l'intérieur de certaines pages**, en plus de l'accès à la page elle-même : par exemple sur « Fichiers audio téléchargés », un compte Uploader Radio (non admin) peut uploader mais ne verra **jamais** les boutons Modifier/Supprimer, ni le menu de choix de catégorie — ces contrôles sont réservés aux administrateurs et n'apparaissent tout simplement pas à l'écran (ils ne sont pas grisés avec une explication, ils sont absents).

