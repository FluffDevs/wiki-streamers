    ## 15. Glossaire

    | Terme | Signification |
    |---|---|
    | **Animateur** | Compte technique portant les identifiants de connexion pour diffuser en direct (distinct d'un compte de connexion au panel, même s'il porte souvent le même nom) |
    | **Catégorie (de médiathèque)** | Musiques / Jingles / Podcasts / Promos / VOD / Autres — détermine où un fichier apparaît et ses champs obligatoires |
    | **Créneau (slot)** | Une entrée du planning : jour/heure, durée, type de contenu, priorité |
    | **Direct / ingest** | La connexion technique active pendant qu'un animateur diffuse en direct |
    | **Ingest RTMP** | Un des deux protocoles de diffusion en direct supportés ; identifiants sous forme Serveur + Clé de flux |
    | **Ingest SRT** | L'autre protocole supporté ; s'arme automatiquement 10 minutes avant un créneau programmé |
    | **Priorité** | Nombre 0-100 qui détermine quel créneau gagne en cas de chevauchement horaire |
    | **Repli (fallback)** | La playlist qui joue quand aucun créneau n'est programmé à un instant donné |
    | **SACEM** | Société française de gestion des droits d'auteur — chaque musique doit porter une référence de son registre |
    | **Validation (validé)** | Statut d'une musique confirmée par un administrateur, seule condition pour qu'elle soit utilisable dans Programmations/Playlists/Médiathèque |
    | **VOD / Rediffusion** | Catégorie de médiathèque pour le contenu à rejouer (rediffusions d'émissions) |

    ---

    ## 16. Questions fréquentes / dépannage

    **J'ai uploadé un fichier mais je ne le vois pas dans la liste.**
    As-tu cliqué sur « Actualiser » après l'upload ? La liste ne se recharge jamais toute seule après un envoi.

    **Ma musique uploadée n'apparaît pas dans Programmations / Playlists / Médiathèque.**
    Une musique doit d'abord être **validée** par un administrateur (page Validation musiques) avant d'être utilisable ailleurs. Ce n'est vrai que pour la catégorie Musiques — les autres catégories sont utilisables dès l'upload.

    **Je ne peux pas enregistrer mon planning, un message de « chevauchement » apparaît.**
    Deux créneaux actifs ont exactement la même priorité et se chevauchent dans le temps. Change la priorité de l'un des deux, ou désactive-en un (case « Actif »).

    **J'ai enregistré mon planning mais rien n'a changé à l'antenne.**
    Un enregistrement peut mettre jusqu'à 30 minutes avant d'être pris en compte par le serveur de diffusion — c'est normal, patiente.

    **Le bouton « Uploader » reste grisé.**
    Il manque au moins un champ obligatoire sur au moins un fichier de la file — la liste exacte des champs manquants s'affiche sous chaque fichier concerné.

    **Je ne trouve pas le bouton pour modifier/supprimer une piste.**
    Ces boutons ne sont visibles que pour les comptes administrateurs. Si ton rôle est Uploader Radio simple, tu ne les verras jamais — ce n'est pas une erreur.

    **Je viens de démarrer un direct mais ça affiche « pas encore connecté ».**
    C'est normal juste après un démarrage : la connexion réelle du logiciel de streaming prend quelques secondes. Si ça persiste plus d'une minute, vérifie la configuration du logiciel de streaming (OBS, etc.) avec les identifiants affichés dans la fenêtre « Secrets ».

    **Un message dit « Ingest déjà en place » quand j'essaie de démarrer.**
    Ce n'est pas une erreur : la connexion est déjà ouverte, inutile de recliquer. L'URL déjà active t'est simplement redonnée.

    **J'ai perdu les identifiants de connexion de mon animateur.**
    Si le direct est actuellement actif, ouvre la fenêtre « Secrets » : l'URL en cours d'utilisation y est affichée et copiable. Sinon, seul un administrateur peut te les redonner (ou les régénérer, ce qui invalide les précédents).

    **J'ai une erreur « session expirée ou non autorisée ».**
    Déconnecte-toi puis reconnecte-toi.

    **J'ai une erreur « erreur interne du serveur backend » qui persiste.**
    Ce n'est pas quelque chose que tu peux résoudre toi-même — préviens un administrateur ou un développeur avec le message exact affiché.

    **Pourquoi la page « Cache » n'affiche pas un vrai cache ?**
    C'est une particularité connue de l'outil : cette page affiche en réalité un journal des requêtes réseau, utile pour du diagnostic technique. Le nom du menu n'a pas été mis à jour en conséquence.
