    ## 9. Schedule (Programmations)

    Route: `/dashboard/programmations`. Access: Administrators, Radio Programmers.

    This is the tool's most complex screen: it builds the station's entire broadcast schedule.

    ### 9.1 Overview

    At the top of the page:
    - **Week navigation**: ◀ / ▶ arrows to change week, a central label "Semaine du [day] [month]" ("Week of [day] [month]"), and a **"Aujourd'hui"** ("Today") button that only appears if you're not on the current week.
    - **"Repli (aucun créneau)"** ("Fallback — no slot"): a dropdown to choose the **fallback playlist**, the one that plays automatically when nothing is scheduled at a given moment. "— aucun —" ("— none —") is a valid choice (in which case, silence when nothing is scheduled).
    - **"Enregistrer"** ("Save") button (top right): saves the entire displayed schedule. Nothing is sent to the server until you click it, **except** that each grid cell updates in your own browser immediately after you confirm a slot (see §9.3) — but until you click "Enregistrer", nobody else sees these changes, and reloading the page would lose them.

    Right below, a live preview:
    - **"En ce moment"** ("Right now"): the title and content of the currently broadcast slot (with its priority), or "— rien —" ("— nothing —") if no slot covers the present moment.
    - **"Ensuite"** ("Next"): the next slot's title and start time, or "— rien —".

    ### 9.2 The weekly grid

    A 7-column (Monday to Sunday) by 24-row (hourly, subdivided by half-hour) grid.

    - **Clicking an empty cell** opens the new-slot creation window, pre-filled with that cell's day and time.
    - **Clicking an existing colored block** opens that slot for editing.
    - Each block shows: its time range ("14:00–16:00"), its priority ("· P50"), a small icon representing its type, and its title.
    - A **disabled** slot (see §9.3, the "Actif" checkbox) appears visually greyed out/dimmed in the grid, but stays clickable for editing.
    - If two slots of different priorities overlap visually, the higher-priority one is drawn on top.

    ### 9.3 Creating or editing a slot — every field in detail

    **Type de créneau** (Slot type) — a dropdown with 7 choices, each pre-filling a default priority and determining the fields that follow:

    | Slot type (French label) | Meaning | Default priority | What you pick next |
    |---|---|---|---|
    | Playlist | Playlist | 1 | a playlist |
    | Playlist alternée | Alternating playlist | 1 | two or more sources that alternate |
    | Émission — direct | Live show | 50 | an animator |
    | Émission — préenregistrée | Pre-recorded show | 50 | a single file from the "Podcasts" category |
    | Habillage / virgule | Jingle/ident | 25 | a single file from the "Jingles" category |
    | Promotion | Ad/Promo | 75 | a single file from the "Ads" category |
    | VOD / Rediffusion | VOD/Rerun | 50 | a single file from the "VOD" category |

    Changing the type automatically recomputes the default priority (you can always adjust it afterwards) and clears already-picked content fields if they no longer apply.

    **Priorité** (Priority) — a 0–100 slider, with the current value shown in parentheses and a reminder of the chosen type's default value. Permanent help text: *"Priorité plus haute = passe devant en cas de chevauchement. Deux créneaux actifs de même priorité qui se chevauchent sont refusés à l'enregistrement."* ("Higher priority = takes precedence on overlap. Two active slots at the same priority that overlap are rejected on save.")

    **Titre** (Title) — text field, required.

    **Récurrence** (Recurrence) — three possible choices:
    - **Toutes les semaines** ("Every week"): the slot recurs every week, on the days checked below.
    - **Une semaine sur N** ("One week in N"): requires an extra **"Une semaine sur"** ("One week in") field (a number from 2 to 8), and a **"Semaine de référence (première diffusion)"** ("Reference week — first broadcast") field (a date). The cycle is counted from the **Monday of the week you pick as reference** — help text: *"Le cycle est compté à partir du lundi de cette semaine, comme le serveur de diffusion — pas de notion de semaine « paire / impaire »."* ("The cycle is counted from the Monday of that week, exactly like the broadcast server — there's no notion of an « odd/even » week.")
    - **Ponctuel (une date)** ("One-off — a single date"): only a **Date** field appears; no weekdays to check; this slot never recurs and shows up in the separate "Événements ponctuels" (One-off events) list (§9.7).

    **Jours** (Days, recurring only) — Monday-to-Sunday checkboxes, at least one must be checked.

    **Début** (Start) / **Fin** (End) — two time pickers. Permanent help text: *"L'heure de fin est la fenêtre du créneau, pas une coupure : le changement se fait à la fin du morceau en cours."* ("The end time is the slot's window, not a hard cut: the change happens at the end of the currently playing track.") — and, for non-live types: *"« Max boucles » renseigné = travail dû, rattrapé s'il démarre en retard ; vide = remplissage, abandonné à la fin de la fenêtre."* ("A filled-in « Max loops » = work owed, caught up if it starts late; empty = filler, abandoned at the end of the window.")

    **Fields specific to each type:**

    - **"Playlist" type**:
      - **Playlist** dropdown (required);
      - **"Lecture aléatoire"** ("Shuffle") checkbox;
      - **"Max boucles (optionnel)"** ("Max loops, optional") field: an integer ≥ 1. Empty = the playlist loops indefinitely until the time window ends (filler, sacrificable). A value = a precise number of laps to do (content considered important, caught up even if it starts late).

    - **"Émission — direct" (Live show) type**:
      - **Animateur** (Animator) dropdown (required) — if the list is empty, message: *"Aucun animateur chargé — crée-les dans « Streamers & direct »."* ("No animator loaded — create them under « Streamers & live ».")
      - Permanent help text: *"Un créneau direct ne joue aucun média : laisser une playlist de fond en dessous n'est pas un conflit, c'est le filet si le direct ne démarre pas."* ("A live slot plays no media: leaving a background playlist underneath is not a conflict, it's the safety net if the live show doesn't start.") — meaning it's normal and recommended to stack a lower-priority playlist under every live slot, so something plays automatically if the animator doesn't connect.

    - **Media types (Pre-recorded show, Jingle, Ad, VOD)**:
      - a **"Catégorie de médiathèque"** ("Media library category") dropdown is shown but **already pre-filled consistently with the chosen type** (you can change it, though it's usually unnecessary);
      - **a single file** to pick (not a list): a search area shows results as clickable rows (title, artist, genre, duration) — clicking a row selects that file;
      - **picking a file automatically recomputes the slot's end time** so it matches the file's real duration exactly (the start time doesn't move, only the end adjusts);
      - if the chosen category is "Musiques", a note specifies: *"seules les pistes validées par un admin sont proposées"* ("only admin-validated tracks are offered");
      - once picked, the selected file's name is shown under the picker;
      - a **"Max boucles (optionnel)"** field is also available here.

    - **"Playlist alternée" (Alternating playlist) type**:
      - Help text: *"Au moins deux sources. À chaque tour, la playlist joue « [nombre] » éléments puis on passe à la suivante. Chaque source garde sa position et son budget de boucles ; l'ensemble n'est rattrapable que si toutes les sources ont un « Max boucles »."* ("At least two sources. Each turn, the playlist plays « [number] » items then moves to the next one. Each source keeps its own position and loop budget; the whole thing is only catch-up-able if every source has a « Max loops ».")
      - Each **source** (at least 2, more can be added) has:
        - a type: **Playlist** or **Liste d'audios** ("List of audio files");
        - **"Nombre joué d'affilée"** ("Number played in a row"): how many items from this source play before moving to the next source (e.g.: 3 songs, then 1 jingle, back to 3 songs...);
        - if type Playlist: a playlist picker;
        - if type "Liste d'audios": a media category picker, then a multi-select search (you can add several files to this source, each listed with an **✕** to remove it);
        - **"Lecture aléatoire"** (Shuffle) checkbox;
        - **"Max boucles (optionnel)"** field;
        - a **"Retirer"** ("Remove") button appears on each source once there are more than 2 (you can't go below 2 sources).
      - **"+ Ajouter une source"** ("+ Add a source") button to add more.

    **Description** — free multi-line text field, optional.

    **"Actif"** ("Active") checkbox — unchecked, the slot stays saved but is never broadcast (useful to prepare a slot in advance, or temporarily suspend a show without deleting it).

    **Buttons at the bottom of the window:**
    - **"Supprimer"** ("Delete") (only when editing an existing slot, not when creating one): immediately removes this slot from the displayed schedule (to be confirmed afterward by clicking "Enregistrer" at the top of the page for it to be final).
    - **"Annuler"** ("Cancel"): closes the window without keeping anything.
    - **"Valider"** ("Confirm"): checks and applies your changes **to the local display** (not yet sent to the server — you still need to click "Enregistrer" at the top of the page afterward).

    ### 9.4 What blocks confirming a slot (error messages)

    Before anything is even sent to the server, clicking **"Valider"** can show:
    - *"Le titre est requis."* ("The title is required.")
    - *"Choisis au moins un jour."* ("Choose at least one day.") (recurring with no day checked)
    - *"La fin doit être après le début."* ("The end must be after the start.")
    - *"Choisis une playlist."* ("Choose a playlist.") (Playlist type with none chosen)
    - *"Choisis un animateur."* ("Choose an animator.") (Live type with none chosen)
    - *"Ajoute au moins un audio."* ("Add at least one audio file.") (media type with none chosen)
    - *"Une alternance demande au moins deux sources."* ("An alternation requires at least two sources.")
    - *"Chaque source « playlist » doit désigner une playlist."* ("Every « playlist » source must specify a playlist.")
    - *"Chaque source « audios » doit contenir au moins un audio."* ("Every « audio » source must contain at least one audio file.")
    - *"« Nombre joué d'affilée » doit être au moins 1."* ("« Number played in a row » must be at least 1.")
    - If, after confirming, your (active) slot overlaps in time with another active slot at the **exact same priority**: *"Chevauchement avec un créneau de priorité [N] : [conflicting slot titles]. Donne-leur des priorités différentes (la plus haute gagne)."* ("Overlap with a slot at priority [N]: [conflicting slot titles]. Give them different priorities (the higher one wins).") — confirmation is blocked until this is resolved (change one slot's priority, or disable one via "Actif").

    ### 9.5 Saving the whole schedule

    Clicking **"Enregistrer"** at the top of the page triggers several checks, in order:

    1. **Looking for any same-priority overlap** across the entire schedule (not just the slot you just edited) — if a conflict exists anywhere, saving is refused with *"Des créneaux actifs de même priorité se chevauchent — le backend les refusera. Donne des priorités distinctes."* ("Active slots at the same priority overlap — the backend will reject them. Give them distinct priorities.") and a detailed list of conflicting pairs appears below.
    2. **Structural validation** of the entire document — on a (rare) technical issue: *"La programmation ne respecte pas le format attendu — rien n'a été envoyé."* ("The schedule doesn't match the expected format — nothing was sent.") with details.
    3. **Sending to the server.** Possible responses:
       - Success: *"Programmation enregistrée. Elle sera prise en compte à l'antenne dans les 30 minutes au plus."* ("Schedule saved. It will be reflected on air within 30 minutes at most.") — **remember this delay well: a saved change is never instant on air**, it can take up to half an hour for the streaming server to pick it up.
       - **Version conflict** (someone else saved in the meantime): *"Conflit : la programmation a été modifiée entre-temps (v...). Rechargement..."* ("Conflict: the schedule was modified in the meantime (v...). Reloading...") — the page automatically reloads the latest version; **your unsaved changes since that reload are lost**, you'll need to redo them after reloading.
       - **Insufficient rights**: *"Ton compte n'a pas le droit de modifier la programmation."* ("Your account doesn't have the right to modify the schedule.")
       - Other error: the message returned by the server, with field-level details if available.

    ### 9.6 A message that can appear when the page loads

    *"N créneau(x) récurrent(s) recalé(s) sur une ancre cohérente (ancien modèle « semaine paire/impaire »). Enregistre pour figer."* ("N recurring slot(s) realigned onto a consistent anchor (old « odd/even week » model). Save to lock it in.") — this means some older slots, created under a now-abandoned recurrence system, have been automatically reinterpreted in an equivalent way. **Click "Enregistrer" to make this reinterpretation permanent**; otherwise, it will be recalculated on every page load (harmless as long as you haven't touched anything, but better to lock it in).

    If the schedule can't be loaded from the server at all: *"Programmation indisponible ([detail]) — brouillon local, l'enregistrement échouera."* ("Schedule unavailable ([detail]) — local draft, saving will fail.") — you can still browse/prepare slots in this state, but nothing can be saved until the server connection is restored.

    ### 9.7 The lists at the bottom of the page

    - **"Événements ponctuels (N)"** ("One-off events (N)"): only single-date (non-recurring) slots, sorted by date. A **"+ Ponctuel"** ("+ One-off") button creates a new one directly.
    - **"Tous les créneaux (N)"** ("All slots (N)"): every slot, with a search box ("Rechercher (titre, playlist, animateur…)" — "Search (title, playlist, animator…)"), sorted by descending priority then by title. Each row shows: the recurrence type as text, the time range, an icon representing the type, the title, a description of the content (playlist name / animator / file(s)), and the priority. Clicking a row opens that slot for editing (same as clicking its grid block).

    ### 9.8 Footer

    A discreet reminder at the bottom of the screen: *"Connecté en tant que [your name] — heures affichées en Europe/Paris, converties en UTC à l'enregistrement · version [version number]"* ("Signed in as [your name] — times shown in Europe/Paris, converted to UTC on save · version [version number]").

    ---

    ## 10. On-air Assets (Habillage d'antenne)

    Route: `/dashboard/habillage-antenne`. Access: Administrators, Radio Programmers, Streamers.

    This page lets you browse, listen to, download, and (for administrators) edit every file in the media library **outside the main Music upload flow** — though it also gives access to the Music category for convenience.

    ### 10.1 Screen layout

    - A row of tabs, one per category: **Musiques** (Music), **Jingles / habillage** (Jingles), **Podcasts / préenregistrés** (Podcasts), **Promos / publicités** (Ads), **VOD / Rediffusions** (VOD/Reruns), **Autres** (Other). The default open tab is "Jingles / habillage".
    - A search box (title, artist, genre).
    - A table with, per row: action buttons (Listen, Download, and Edit for admins), title, artist, genre.
    - If a tab has never been opened, its content loads the first time you click it (not all preloaded).
    - Message if the category is empty: *"Aucun élément dans cette catégorie (ou endpoint indisponible)."* ("No item in this category (or endpoint unavailable).")
    - Message if a search returns nothing but the category has items: *"Aucun élément."* ("No item.")

    ### 10.2 Actions per row

    - **Play/Stop** (play/stop icon): starts playback. A player appears, **stuck to the bottom of the screen** (visible even while scrolling), showing the current track's title/artist and standard browser audio controls. Clicking the same row's button again stops it.
    - **Download**: downloads the file to your computer, with a readable filename (title + correct extension) rather than the raw technical ID.
    - **Edit** (pencil icon, administrators only): opens a window with **Title**, **Artist**, **Genre** fields for every category, plus **Album**, **Year**, **Language**, **SACEM registry** only if the active category is "Musiques". **Cancel** / **Save** buttons.

    ### 10.3 In case of a playback or download issue

    If the server returns an unexpected response (JSON or an error page instead of the audio file), the message *"Le serveur a renvoyé une réponse inattendue (pas un fichier audio)."* ("The server returned an unexpected response — not an audio file.") appears — this usually signals a server-side technical issue, not a mistake on your part; try again, and if it persists, tell an administrator.

    ### 10.4 Footer note

    *"Connecté en tant que [your name]. Lecture et téléchargement passent par le cache S3 ; rien n'est stocké côté navigateur en dehors du fichier téléchargé."* ("Signed in as [your name]. Playback and download go through the S3 cache; nothing is stored on the browser side beyond the downloaded file.") — in other words, listening to a file here never saves anything on your computer; only an explicit click on "Télécharger" (Download) actually saves a file to your machine.

    ---

    ## 11. Music Validation (Validation musiques)

    Route: `/dashboard/validation-musiques`. Access: **Administrators only.**

    This is where **only music tracks** (the "Musiques" category) pass through for a first review after upload — the other categories (jingles, podcasts, ads, VOD, other) don't have this step and are usable right after upload.

    ### 11.1 General behavior

    - A search box (title, artist).
    - One card per pending track, each with a built-in player (a Listen button in the header, which shows the audio player right below it).
    - Each card's header shows: the title, the artist, the track's technical ID, and, if known, the cache page it's indexed under.
    - Message if nothing is pending: *"Aucune piste à valider."* ("No track to validate.")
    - Pagination controls at the bottom if the list is long.

    ### 11.2 Editable fields on each card

    - **Titre** (Title) (pre-filled with the uploaded value).
    - **Artiste** (Artist).
    - **Album** (optional at this stage — unlike upload, this field is not required to validate).
    - **Genre** (dedicated picker, optional).
    - **Année** (Year, optional, digits only).
    - **Langue** (Language) (dropdown + custom field if "Autre"/"Other", optional).
    - **Durée** (Duration): read-only.
    - **Registre SACEM** (SACEM registry) (optional, with the same SACEM help links as on upload).
    - **Point de départ (s)** / **Point de fin (s)** (Cue-in/out, optional at this stage).
    - **Contenu explicite** (Explicit content) checkbox, **Contenu furry** (Furry content) checkbox.

    > Contrary to what you might expect, validation **only requires Title and Artist** as mandatory fields — the others (album, genre, year, language, SACEM, cue points) can be left empty if you choose to validate without filling them in. Of course, it's recommended to check/complete them before validating, but the tool doesn't technically force you to, apart from Title/Artist.

    ### 11.3 The two possible actions

    - **"Valider"** (Validate) button (green check): saves the fields as shown on the card and marks the track as validated. It then immediately disappears from this list, and will now show up in Media Library and be selectable in Schedule and when adding to a playlist. Confirmation message: *"« [title] » validée."* ("« [title] » validated.")
      - Checks before validation: Title and Artist not empty (*"Titre et artiste sont obligatoires avant validation."* — "Title and artist are required before validation."), Year/cue points numeric if provided, cue-out strictly greater than cue-in if both are provided.
    - **"Refuser"** (Reject) button (red cross): asks for confirmation — *"Refuser et supprimer définitivement « [title] » ?"* ("Reject and permanently delete « [title] »?") — then, if confirmed, **deletes the file and its record forever**. This is **not** a simple "send back" or "set aside" action: the track is erased from the server. Confirmation message: *"« [title] » refusée et supprimée."* ("« [title] » rejected and deleted.")

    ### 11.4 A technical detail worth knowing

    Right after validating or rejecting a track, it might briefly reappear in the list if you refresh very quickly (the server's cache takes a few seconds to update) — the tool protects against this internally by hiding any track already processed during this session, but a full manual page refresh (F5) could briefly bring it back; this isn't an error, wait a few seconds and refresh again if needed.

