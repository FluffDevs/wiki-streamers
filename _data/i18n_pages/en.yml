    ## 8. Playlists

    Route: `/dashboard/playlists`. Access: Administrators, Playlist Management.

    ### 8.1 Screen overview

    The screen is split in two: a left column (playlist list) and a main area on the right (content of the selected playlist).

    ### 8.2 Left column

    - **"Playlists"** title with a badge showing the total count.
    - **Refresh** button (icon): reloads both the playlist list and the available music catalog.
    - **+** button: opens the new-playlist creation window.
    - A search-by-name box (only shown once at least one playlist exists).
    - The list itself: each row shows an avatar (the name's first letter), the playlist's name, and its track count. An **✕** button on each row (on hover) deletes it directly.
    - Special states:
      - Loading: *"Chargement..."* ("Loading...").
      - No playlist at all: *"Aucune playlist"* ("No playlist") + *"Clique sur + pour en créer une"* ("Click + to create one").
      - A search returns nothing: *"Aucun résultat"* ("No result") + *"Essaie un autre nom"* ("Try another name").

    ### 8.3 Creating a playlist

    **+** button → **"Nouvelle playlist"** ("New playlist") window:
    - **Nom** (Name) field (required, example shown: "Sélection du vendredi soir"). Pressing Enter also submits.
    - **Annuler** (Cancel) button.
    - **Créer** (Create) button (greyed out while the name is empty; shows "Création..." — "Creating..." — while in progress).

    The created playlist appears immediately in the list, empty (0 tracks).

    ### 8.4 Deleting a playlist

    Clicking a row's **✕** → confirmation window: *"Supprimer « [name] » ?"* ("Delete « [name] »?") with the text *"Cette action est irréversible : la playlist et son ordre de pistes seront définitivement supprimés."* ("This action is irreversible: the playlist and its track order will be permanently deleted.") **Annuler** (Cancel) / **Supprimer** (Delete) buttons (shows "Suppression..." — "Deleting..." — while in progress). If the deleted playlist was open on screen, the view reverts to "Aucune playlist sélectionnée" ("No playlist selected").

    ### 8.5 Viewing and editing a playlist's content

    Clicking a playlist in the left list opens it on the right with:
    - Its name as a title, and below it: *"N piste(s) · [total duration]"* ("N track(s) · [total duration]") (the total duration is computed and shown as "1h 23m" or "4m 05s").
    - **"+ Ajouter des musiques"** ("+ Add tracks") button (see §8.6).
    - An **autosave status indicator**, on the right, that changes on its own:
      - "✓ Enregistré" ("Saved", idle/normal state);
      - "Modifications en attente..." ("Changes pending...", you just made a change, saving will trigger shortly);
      - "Enregistrement..." ("Saving...", currently sending);
      - "Échec — réessayer" ("Failed — retry", autosave failed; **clicking this indicator manually retries the save**).
    - The playlist's track list, each with:
      - an editable numeric field showing its **position** (you can type a new number directly and press Enter or click elsewhere to move the track there);
      - a **drag handle** (6-dot icon) to reorder by dragging with the mouse;
      - the title (with an **"E"** badge if explicit), the artist, the genre (badge), plus an extra line with album/language/year if known, and another line showing cue points ("▶ 0:00 – 3:12" for example) if set;
      - the duration;
      - an **✕** button to remove the track from the playlist (doesn't delete the track from the general catalog, just from this playlist).
    - If the playlist is empty: *"Cette playlist est vide"* ("This playlist is empty") + *"Ajoute des musiques pour commencer à construire l'ordre de diffusion"* ("Add tracks to start building the broadcast order") + an add-tracks button.
    - Pagination controls at the bottom of the track list if it's long.

    **Important point**: changes (adding, removing, reordering) are **saved automatically** about 1 second after your last action (no separate "Save" button to click). If you quickly switch playlists or close the tab right after a change, wait to see "Enregistré" ("Saved") to be sure it was actually captured.

    ### 8.6 Adding tracks to a playlist

    **"+ Ajouter des musiques"** button → a full-screen window opens: **"Ajouter des musiques à « [playlist name] »"** ("Add tracks to « [playlist name] »").

    **Search and filter tools**, all combinable:
    - Text search box (title, artist, album).
    - **"Tous les artistes"** ("All artists") dropdown → list of every artist present in the catalog.
    - **"Tous les genres"** ("All genres") dropdown.
    - **"Toutes les langues"** ("All languages") dropdown.
    - **"Tous les albums"** ("All albums") dropdown.
    - **"Explicite : indifférent"** ("Explicit: indifferent") dropdown → "Explicite seulement" (Explicit only) or "Non explicite seulement" (Non-explicit only).
    - **Year** range: two Min / Max fields.
    - **Duration (min)** range: two Min / Max fields, in minutes.
    - **"Réinitialiser"** ("Reset") button (only shown if at least one filter is active): resets every filter at once.

    **Selection and adding**:
    - **"Tout sélectionner (N)"** ("Select all (N)") checkbox at the top: checks/unchecks every track **matching the currently active filters** (not necessarily the whole catalog if a filter is applied).
    - Every result row has its own checkbox, and an individual **+** button on the right (shows a green check if the track is already in the playlist — the button then becomes disabled with the tooltip "Déjà dans la playlist" — "Already in the playlist").
    - **"Ajouter à la playlist (N)"** ("Add to playlist (N)") button: adds all currently checked tracks at once.
    - Note: only tracks **already validated by an administrator** show up in this list (see chapter 11 "Music Validation").
    - While the playlist's current content hasn't finished loading yet, the add buttons stay disabled with the tooltip *"Chargement de la playlist en cours..."* ("Playlist is loading...") — wait a moment.

    **"Terminé (N piste(s))"** ("Done (N track(s))") button at the bottom closes the window (additions are already applied, no separate "confirm" needed).

    ### 8.7 Where does a playlist's author come from?

    A playlist's "author" field fills itself automatically with your email address (derived from your login account) — you never have to type it yourself.

