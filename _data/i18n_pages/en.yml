    ## 13. Debug API

    Route: `/dashboard/debug-api`. Access: **Administrators only.**

    A **technical** tool, meant for support and diagnostics — not for everyday scheduling or editing work.

    - Dozens of pre-built requests, grouped by area (public schedule, schedule admin, animators, live, users, media library, playlists, legacy cache/streaming), runnable one at a time.
    - A button to run every GET/HEAD (read-only requests, so no risk) at once.
    - A button to run **every** preset at once, including ones that **actually modify data** (creating a test animator, rotating secrets, deleting a music track) — a confirmation window shows before running, since this can have real, disruptive effects if used carelessly.
    - A decoder for the current login token (JWT) and OIDC profile, to check what your account actually carries as information/groups.
    - Automatic validation of certain responses against the expected data schemas, with details on what doesn't match if an issue is detected.
    - A custom request builder (method, path, body, toggle authentication on/off) to test a specific call.

    **Only use this page if you know what you're doing, or under a developer's guidance** — several actions here are genuinely destructive.

    ---

    ## 14. Cache (request log)

    Route: `/dashboard/cache`. Access: **Administrators only.**

    > This page's menu name ("Cache") is misleading: it does **not** show a cache management tool, but a **network request log** of the application's own calls.

    - Each log row corresponds to a call the panel made to its own internal routes since you opened this page (or since the last clear): method, URL, response status, duration.
    - Clicking a row expands it to show the full detail: request headers and body sent, response headers and body received. **Any authentication token is automatically masked**, it never appears in clear text here.
    - A filter lets you narrow the display by method or URL.
    - **"Vider le journal"** ("Clear log") button: erases the entire displayed history (deletes nothing server-side, just the local display).
    - The log is **entirely local to this open page**: it starts from scratch every time you reload or close the page — it's never shared with anyone else nor stored anywhere.

    **Typical use**: an administrator trying to understand why an action "isn't saving" can open this page, redo the problematic action elsewhere in another tab, then come back here to see exactly which request was sent and what the server answered.

