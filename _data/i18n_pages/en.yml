home:
  body: |
    # Fluff Radio Streamer Wiki

    This wiki explains how to configure OBS to publish to the Fluff Radio broadcast server.

    Goal: give streamers a reliable, repeatable and secure workflow to go live.

    ## Language versions

    - English: [Home EN](/en/)
    - Francais: [Accueil FR](/fr/)

    ## Quick path

    1. Read prerequisites (your SRT or RTMP mode)
    2. Get your connection link from the panel
    3. Configure OBS
    4. Start your stream
    5. Use troubleshooting when issues appear

    ## What you will find here

    - A setup guide without arbitrary values: use only team-approved technical settings.
    - Pre-live, in-live and post-live checklists.
    - A diagnosis method for connection failures, freezes, audio loss and sync drift.
    - An escalation method with the right evidence (logs, symptoms, timestamps).

    ## Navigation

    - [Configuration Guides](/en/guides/)
    - [Prerequisites](/en/guides/prerequisites/)
    - [Broadcast Credentials](/en/guides/stream-credentials/)
    - [Configure OBS](/en/guides/configure-obs/)
    - [Go Live](/en/guides/go-live/)
    - [Troubleshooting](/en/troubleshooting/)
    - [Admin Panel (staff)](/en/panel-admin/) — full guide to the `programmation.fluffradio.com` panel (media library, playlists, schedule, validation, streamers...)

    ## Important notes

    - Never share your broadcast credentials (secrets/passphrase).
    - These credentials are unique per streamer and are retrieved exclusively from the panel.
    - After a secrets regeneration by an administrator, update OBS immediately.
    - Always run a short private test before any public live.

guides-home:
  body: |
    # Configuration Guides

    Recommended path:

    1. [Prerequisites](/en/guides/prerequisites/)
    2. [Broadcast Credentials](/en/guides/stream-credentials/)
    3. [Configure OBS](/en/guides/configure-obs/)
    4. [Go Live](/en/guides/go-live/)

    ## Why this order works

    - Prerequisites reduce technical risk before setup.
    - Credentials ensure RTMP authentication is valid.
    - OBS setup aligns quality and stability.
    - Go-live steps cover live operations and incident handling.

    ## Maintenance tip

    After a stable live, save a known-good OBS profile and only change settings outside live hours.

    [Back to home](/en/)

prerequisites:
  body: |
    # Prerequisites

    Before anything else, two things to understand: your account's broadcast mode, and access to the admin panel (`programmation.fluffradio.com`). Everything else in this wiki follows from these.

    ## The two broadcast modes

    Fluff Radio supports two protocols. Your account is only authorized for one or more specific modes, configured by an administrator.

    - **SRT** (default, recommended mode): the key thing to remember — **your connection link opens itself automatically, 10 minutes before your scheduled slot starts.** Nothing to start manually.
    - **RTMP** (fallback mode, for software that can't do SRT): unlike SRT, nothing opens automatically. You must click "Demarrer / armer" ("Start / arm") in the panel yourself at the right moment.

    Remember this simple rule:

    > **SRT = automatic, 10 minutes before. RTMP = manual, you click it yourself.**

    ## Accessing the panel

    1. Open `programmation.fluffradio.com`.
    2. Click "Se connecter" ("Log in"), enter your username and password.
    3. Go to the "Streamers" menu (left sidebar). If you don't see it, your account doesn't have the right role yet — ask an administrator to add it.

    ## Your animator profile

    On the "Streamers" page, a "Ma fiche animateur" ("My animator profile") block is reserved for you. It shows your username, your allowed modes, your SRT encryption level, your end-of-live policy (see [Go Live](/en/guides/go-live/)), and whether you can broadcast outside your slot.

    - If this block says no profile is linked to your account: ask an administrator to create one for you. Without it, you can't go live at all.
    - If access is denied: your animator account exists but has been disabled. Contact an administrator.

    ## Hardware and connectivity

    - Stable internet connection (ethernet preferred)
    - Working microphone, headphones recommended to avoid feedback loops
    - OBS Studio (or equivalent software supporting RTMP and/or SRT depending on your mode), up to date

    ### Practical guidance

    - Avoid Wi-Fi when possible to reduce packet loss.
    - Close network-heavy apps during live sessions.
    - Reboot before an important show; avoid system updates right before going live.

    ## Fast validation before going live

    1. Open OBS, confirm your main scene is ready.
    2. Confirm your microphone captures signal without clipping.
    3. Open the panel's "Streamers" page to check your mode and access.
    4. If your slot is approaching (SRT), keep the page open: the link will appear on its own 10 minutes before.

    [Next step: getting your credentials](/en/guides/stream-credentials/)

credentials:
  body: |
    # Getting Your Connection Link

    This link (or your Server + Key credentials) is retrieved **exclusively from the panel** (`programmation.fluffradio.com`, "Streamers" page), never through any other channel.

    ## Case 1: you're in SRT mode with a scheduled slot (the normal case)

    Nothing to trigger yourself. Starting 10 minutes before your slot's start time, the system automatically opens the connection on its side.

    1. Open the panel's "Streamers" page as your slot approaches (or earlier, the info updates itself, refreshed every 5 seconds).
    2. In the "Direct" ("Live") block, your "URL d'ingest" ("Ingest URL") link is already ready, with a "Copier" ("Copy") button.
    3. Clicking "Demarrer / armer" ("Start / arm") at this point starts nothing new — it just hands you back the already-open link. You can click it safely.
    4. Paste that link into your streaming software (see [Configure OBS](/en/guides/configure-obs/)).

    If the block still shows "A l'antenne : — personne —" ("On air: — nobody —") while you're less than 10 minutes from your slot, wait a minute and refresh the page.

    ## Case 2: you're in RTMP mode, or you want to broadcast outside a slot

    In these two cases, nothing opens automatically — you trigger the connection yourself, in the "Direct" block on the "Streamers" page:

    1. The Animator field already shows your name (fixed).
    2. Pick the Mode (if several are allowed for your account).
    3. If SRT: you can force a different encryption level for this session only (not saved).
    4. Optionally set an on-air title (otherwise your scheduled slot's title is used).
    5. Click "Demarrer / armer".
    6. The link (or Server + Stream Key) appears in the same block.

    Broadcasting outside a slot is only possible if an administrator has explicitly authorized your account to do so. If the button stays inactive, that's likely why.

    If a message says "Ingest deja ouvert pour [someone else]" ("Ingest already open for [someone else]"): someone else is already broadcasting. An administrator can force a takeover if needed; you alone cannot.

    ## Security best practices

    - Never share this link, or your secrets, with anyone.
    - Never show the OBS configuration window with the link/key visible during a filmed session or screen share.
    - The link shown in the panel is only valid during an active session: once lost after the session ends, you'll need to retrieve a new one (automatic arming at your next slot, or a new click on "Demarrer / armer").
    - If you suspect your secrets have leaked, ask an administrator **immediately** to regenerate them from the "Secrets" window on your animator profile. Regenerating immediately invalidates the old credentials; if you're live at the moment of regeneration, your current broadcast isn't physically cut, but an administrator will then need to restart your live session using "Forcer" ("Force") to give you a working link again.

    [Next step: Configure OBS](/en/guides/configure-obs/)

configure-obs:
  body: |
    # Configure OBS

    This page covers the minimum configuration to connect OBS to the broadcast server.

    Goal: produce a stable, audible and synchronized stream without inventing non-approved technical values.

    ## 1. Open stream settings

    In OBS:

    1. Open `Settings`
    2. Open the `Stream` tab
    3. Choose `Service: Custom...` (or equivalent for your OBS version)

    ## 2. Enter broadcast credentials

    The format depends on your account's mode (see [Prerequisites](/en/guides/prerequisites/)) — both are retrieved from the panel's "Streamers" page, see [Getting Your Connection Link](/en/guides/stream-credentials/).

    ### In RTMP

    The information is split into two separately copyable parts in the panel:

    - `Server`: paste the "Serveur" value shown in the panel.
    - `Stream Key`: paste the "Cle de flux" value shown in the panel.

    ### In SRT

    You get a single full URL (no Server/Key split) — paste it as-is into your software's SRT connection field (the exact field depends on your OBS version or SRT plugin).

    ### Input best practices

    - Copy/paste from the panel, never a hand-written value.
    - Avoid hidden spaces or line breaks.
    - The link is only valid during an active session: if you lose it, go back to the panel rather than reusing an old one.
    - Re-validate after any secrets regeneration by an administrator.

    ## 3. Output settings baseline

    - Encoder: hardware encoder if available (NVENC/AMF/QuickSync), otherwise x264
    - Video bitrate: technical team approved value
    - Audio: AAC at team approved bitrate
    - Keyframe interval: 2 seconds

    ### Why these settings matter

    - Encoder choice affects system load and quality consistency.
    - Bitrate too high causes network instability; too low causes artifacts.
    - Audio quality heavily impacts perceived broadcast quality.
    - Keyframe interval impacts compatibility and recovery after packet loss.

    ### Checks to run

    1. Observe CPU/GPU usage during a test.
    2. Confirm there are no encoder overload warnings.
    3. Confirm scene readability in a monitoring player.

    ## 4. Video settings baseline

    - Base canvas: aligned with your scene composition
    - Output resolution: team-approved target for your setup
    - FPS: 30 by default, 60 only if validated by your team

    ### Stability strategy

    - Prioritize stability over maximum performance.
    - If drops appear, reduce FPS or output resolution first.
    - Change one setting at a time to isolate impact.

    ## 5. Pre-live validation

    1. Start a private/off-air test
    2. Check bitrate stability
    3. Check audio/video sync
    4. Check audio return quality

    ## 6. Recommended verification methods

    1. Short test (60-120s): validates connection and credentials.
    2. Longer test (10-15 min): reveals heat/load/intermittent issues.
    3. Local recording review (if enabled): validates perceived quality.
    4. Cross-check: second person confirms reception quality.

    ## 7. Common mistakes to avoid

    - Changing multiple settings right before live.
    - Forgetting to save a known-good OBS profile.
    - Going live without checking microphone levels.
    - Using credentials from another streamer account.

    ## 8. When to escalate to support

    Escalate if:

    - Connection failures persist after URL/key verification.
    - Network drops are repeatable across tests.
    - Encoder overload remains even after lowering complexity.

    Provide:

    1. Test timestamp
    2. Screenshots of stream/output/audio/video settings
    3. Exported OBS log
    4. Short symptom description

    [Next step: Go Live](/en/guides/go-live/)

go-live:
  body: |
    # Go Live

    ## Pre-launch checklist

    - OBS scenes ready
    - Microphone and desktop audio verified
    - Link/credentials correctly entered in OBS (see [Configure OBS](/en/guides/configure-obs/))
    - Stable internet connection
    - Panel's "Streamers" page open to check your status

    ### Last-minute checks

    - Confirm the correct scene is in preview (Studio Mode).
    - Confirm critical overlays/alerts are active.
    - Confirm microphone hardware mute is off.
    - Confirm no private windows can be captured accidentally.

    ## Start sequence

    - **In SRT with a scheduled slot**: nothing to "start" panel-side — your link already opened automatically 10 minutes before (see [Getting Your Connection Link](/en/guides/stream-credentials/)). Enter it in OBS, then simply click `Start Streaming` in OBS.
    - **In RTMP, or outside a slot**: first click "Demarrer / armer" in the panel to get your link, enter it in OBS, then click `Start Streaming` in OBS.
    - In both cases, check the panel's feedback: the "On air" badge switches to "(connecte)" ("connected") once the connection is actually established. Seeing "(pas encore connecte)" ("not connected yet") right after starting is normal, it only lasts a few seconds.

    ## During live

    - Monitor OBS `Stats` (dropped frames, bitrate)
    - Monitor audio levels continuously
    - Avoid major technical changes during sensitive segments

    ### Priority warning signs

    - Sudden effective bitrate drops
    - Repeating network errors
    - Persistent CPU/GPU spikes
    - Increasing audio delay over time

    ## Fast incident response

    1. Switch to a fallback scene if needed.
    2. Lower one complexity factor (scene load, FPS, output scale).
    3. Inform your audience clearly and briefly.
    4. Record exact incident time for post-live analysis.

    ## End of slot: what happens automatically

    Your animator profile carries an "end-of-live" setting, chosen by an administrator, that determines what happens if you're still broadcasting when your scheduled slot's end time arrives:

    - **Cut at the end of the slot**: automatic cut right at the scheduled time.
    - **5 extra minutes then cut**: 5 minutes of grace before an automatic cut.
    - **15 extra minutes then cut**: 15 minutes of grace before an automatic cut.
    - **Never automatically cut**: it's up to you (or an administrator) to end the live session manually.

    This system never cuts an ongoing live session without reason: the automatic cut only kicks in for a slot that has genuinely ended, never to free up the air while you're still broadcasting on time.

    ## Ending your live session yourself

    Whether before or after the scheduled end time, you can end your own live session at any moment, with no condition tied to the schedule: go to the "Streamers" page, "Direct" block, click "Arreter" ("Stop"). A message confirms "Direct coupe." ("Live session ended.") (or "Rien n'etait ouvert." — "Nothing was open." — if nothing was running; harmless).

    ## End of stream (OBS side)

    1. Click `Stop Streaming` in OBS
    2. Click "Arreter" in the panel (Streamers page) if not already done automatically by your end-of-live policy
    3. Save scene changes if needed
    4. Report technical incidents for follow-up

    ## Recommended post-live technical review

    1. Note what worked and what failed.
    2. Save a stable reference OBS profile.
    3. Archive logs if incidents occurred.
    4. Plan fixes outside live windows.

    [Open troubleshooting](/en/troubleshooting/)

troubleshooting-home:
  body: |
    # Troubleshooting

    If the stream fails to start or quality drops, begin here.

    Recommended method:

    1. Isolate the main symptom
    2. Check the most likely causes first
    3. Apply one correction
    4. Re-test before changing anything else

    ## Common issues

    - [OBS cannot connect to the server](/en/troubleshooting/common-issues/#obs-cannot-connect-to-the-server)
    - [Stream freezes or stutters](/en/troubleshooting/common-issues/#stream-freezes-or-stutters)
    - [No microphone audio](/en/troubleshooting/common-issues/#no-microphone-audio)
    - [Audio out of sync](/en/troubleshooting/common-issues/#audio-out-of-sync)

    ## Diagnostic best practices

    - Change one parameter at a time.
    - Record timestamp, action, and outcome.
    - Keep before/after screenshots of key settings.

    ## Escalation

    If the issue remains after checks:

    1. Capture screenshots of OBS stream/output/audio/video settings
    2. Export OBS logs
    3. Contact technical support with timestamp and symptom summary

    ## Minimum quality gate before going live again

    - Stable server connection
    - Intelligible audio with no clipping
    - Smooth video without recurring freeze events

    [Open common issues page](/en/troubleshooting/common-issues/)

common-issues:
  body: |
    # Common Issues

    ## I still don't see a link even though my slot is approaching

    - Check that your account is actually in **SRT** mode (RTMP never arms itself automatically, you must click "Demarrer / armer" yourself, see [Getting Your Connection Link](/en/guides/stream-credentials/)).
    - If you're indeed in SRT, wait it out: arming happens exactly at 10 minutes before the start, not earlier. Refresh the panel's "Streamers" page.

    ## A message says the ingest is already open for someone else

    Someone else is currently broadcasting. Wait for them to finish, or contact an administrator if there's an emergency justifying a forced takeover ("Force" is admin-only).

    ## The panel shows "not connected yet" even though I started streaming

    Normal for a few seconds while the connection establishes technically. If it persists more than a minute, check your OBS configuration (mode, exact link) or contact an administrator.

    ## I lost my link / my credentials no longer work

    - If your live session is still active, open the "Secrets" window from your animator profile: the URL currently in use is shown there and copyable.
    - Otherwise, only an administrator can give your credentials back to you or regenerate them. Regenerating immediately invalidates the old ones.

    ## My account seems blocked / disabled

    Contact an administrator: only they can reactivate your animator account.

    ## OBS cannot connect to the server

    Check:

    - The link/credentials were retrieved **from the panel** just before (not an old reused value)
    - Right field for the right mode: separate Server+Key in RTMP, a single URL in SRT (don't mix them up)
    - Working internet connection
    - Firewall/antivirus not blocking OBS

    Additional diagnostics:

    - Confirm the mode chosen in OBS matches the mode retrieved in the panel (SRT vs RTMP).
    - Confirm the secrets haven't been regenerated in the meantime by an administrator.
    - Confirm system clock is correct.

    Actions:

    1. Go back to the panel's "Streamers" page and re-copy the link/credentials
    2. Restart OBS
    3. Test from another network if possible
    4. Contact an administrator if the issue persists

    ## Stream freezes or stutters

    Check:

    - Bitrate too high for upload bandwidth
    - CPU/GPU saturation
    - Network dropped frames in OBS stats

    Additional diagnostics:

    - Determine if saturation is constant or burst-based.
    - Compare behavior with light vs heavy scenes.
    - Check if freeze events match alerts/transitions/browser sources.

    Actions:

    1. Lower output resolution
    2. Lower bitrate
    3. Switch to 30 FPS
    4. Close heavy background apps
    5. Temporarily simplify overlays/filters

    ## No microphone audio

    Check:

    - Correct microphone source selected
    - Mute disabled
    - Proper gain
    - OS microphone permissions granted

    Additional diagnostics:

    - Test microphone in another application.
    - Confirm audio interface profile did not change.
    - Use monitoring to detect low-level noise with weak gain.

    Actions:

    1. Re-select microphone device
    2. Test microphone outside OBS
    3. Restart OBS
    4. Recreate microphone source if corrupted

    ## Audio out of sync

    Check:

    - Incorrect audio sync offset
    - System load too high

    Additional diagnostics:

    - Determine whether the delay is fixed or increasing.
    - Compare live output with local recording.
    - Check for heavy real-time audio processing.

    Actions:

    1. Reset audio offsets
    2. Reduce encoding load
    3. Run a short validation test before resuming live

    ## Useful logs for support

    1. Export OBS log from a failing session.
    2. Note exact symptom timestamps.
    3. Attach screenshots of `Stream`, `Output`, `Audio`, `Video` settings.
    4. List attempted fixes to avoid repeated steps.

    [Back to troubleshooting](/en/troubleshooting/)

admin-guide:
  body: |
    # Complete User Guide — FluffRadio Admin Panel

    > This guide describes **absolutely everything** you can see and do in the FluffRadio admin panel (`programmation.fluffradio.com`), field by field, button by button, message by message. The goal: you should never need to ask "how do I do this?" — if a question crosses your mind while reading, a chapter is missing; tell us.

    ## Table of contents

    1. [Before you start: key concepts](#1-before-you-start-key-concepts)
    2. [Signing in and out](#2-signing-in-and-out)
    3. [The structure shared by every page](#3-the-structure-shared-by-every-page)
    4. [Who has access to what (roles and groups)](#4-who-has-access-to-what-roles-and-groups)
    5. [Home](#5-home)
    6. [Media Library (Médiathèque)](#6-media-library-médiathèque)
    7. [Uploaded Audio Files (Fichiers audio téléchargés)](#7-uploaded-audio-files-fichiers-audio-téléchargés)
    8. [Playlists](#8-playlists)
    9. [Schedule (Programmations)](#9-schedule-programmations)
    10. [On-air Assets (Habillage d'antenne)](#10-on-air-assets-habillage-dantenne)
    11. [Music Validation (Validation musiques)](#11-music-validation-validation-musiques)
    12. [Streamers (animators & live control)](#12-streamers-animators--live-control)
    13. [Debug API](#13-debug-api)
    14. [Cache (request log)](#14-cache-request-log)
    15. [Glossary](#15-glossary)
    16. [FAQ / Troubleshooting](#16-faq--troubleshooting)

    ---

    ## 1. Before you start: key concepts

    A few notions come up everywhere in the tool. Understanding them once saves a lot of questions later. Note: the interface itself is entirely in French; this guide keeps the exact French labels next to their English meaning so you can match what you see on screen.

    - **Media library category** ("catégorie de médiathèque"). Every audio (or video) file belongs to exactly one category: **Musiques** (Music), **Jingles / habillage** (Jingles), **Podcasts / préenregistrés** (Podcasts), **Promos / publicités** (Ads), **VOD / Rediffusions** (VOD/Reruns), or **Autres** (Other). The category determines where the file shows up, which fields are required on upload, and how you find it in Schedule.
    - **Validation** ("validation"). Only the **Musiques** (Music) category goes through a validation workflow (the "Validation musiques" page): an uploaded track is only usable in Schedule and visible in Media Library once an administrator has validated it. The other categories (jingles, podcasts, ads, VOD, other) have **no** such workflow — they're usable as soon as they're uploaded.
    - **Slot** ("créneau"). A cell in the broadcast schedule: a day/time, a duration, a content type (playlist, live, a single file, or an alternating rotation), and a priority.
    - **Priority** ("priorité"). A number from 0 to 100 attached to every slot. If two slots overlap in time, the one with the higher priority is broadcast. Two active slots at the **exact same** priority that overlap are **forbidden** — the system refuses to save them until you change one.
    - **Animator** ("animateur"). A technical account, separate from a panel login account, that carries the connection credentials (secrets) used by streaming software (OBS, etc.) to broadcast live. A human user can be "linked" to an animator account of the same name.
    - **Live / ingest** ("direct" / "ingest"). The technical connection an animator opens to broadcast live, either RTMP or SRT.
    - **UTC / timezone.** Internally, every time is stored in Universal Time (UTC). The panel displays and lets you type times in **Paris time**, converting automatically — you never have to do that conversion yourself.

    ---

    ## 2. Signing in and out

    ### Signing in

    1. Open `programmation.fluffradio.com`. The public home page appears.
    2. Click **"Se connecter"** ("Log in").
    3. You're redirected to the secure sign-in page (Cognito, FluffRadio's identity service). Enter your username and password.
    4. Once signed in, you're automatically taken to `/dashboard` (the panel's home page).

    ### Special cases when signing in

    - **You open a panel page while signed out**: instead of the page content, you see "Vous n'êtes pas connecté" ("You are not signed in") with a **"Se connecter"** button.
    - **You're signed in but your account can't access this specific page**: you see **"Accès refusé — Votre groupe IAM ne permet pas d'accéder à cette page"** ("Access denied — your IAM group doesn't allow access to this page"), with a **"Retour au dashboard"** ("Back to dashboard") button that takes you to the first page your account can actually view.
    - **Authentication error** (rare, usually a temporary hiccup of the sign-in service): a message "Erreur d'authentification : [technical detail]" shows instead of the page. Try reloading; if it persists, tell an administrator.

    ### Signing out

    Click **"Déconnexion"** ("Log out"), visible in the top-right of the dashboard bar on every page. You're immediately signed out and sent back to the sign-in page.

    ---

    ## 3. The structure shared by every page

    Once signed in, every dashboard page (`/dashboard/...`) shares the exact same layout:

    - **Left sidebar**:
      - the FluffRadio logo;
      - a **"LIVE STREAM"** card that constantly shows what's currently playing on air (loaded from the streaming server, auto-refreshed every 5 seconds), with a colored status badge:
        - green / "EN DIRECT" ("LIVE"): someone is broadcasting live right now;
        - another color / "READY": the system is ready but nothing special is happening (normal automatic playback);
        - greyed out / "HORS LIGNE" ("OFFLINE"): the streaming server isn't responding;
      - navigation links — **you only see the pages your account has access to** (see chapter 4). If a page mentioned in this guide doesn't show up in your sidebar, your account simply doesn't have the right; it's not a bug.
    - **Top bar**: a "FluffRadio Admin" label, your name (or your email if no name is set on your account), and the **"Déconnexion"** ("Log out") button.
    - **Content area**: the page title and its own content, described chapter by chapter below.

    A **breadcrumb / page title** at the top of the content area always reminds you where you are.

    ---

    ## 4. Who has access to what (roles and groups)

    Your account belongs to one or more **groups**, assigned by an administrator. These groups determine what you see:

    | Group (internal name) | Name used in this guide |
    |---|---|
    | `admins` | Administrators — access to everything, no exception |
    | `AccesMediatheque` | Media Library Access |
    | `GestionPlaylist` | Playlist Management |
    | `ProgrammeursRadio` | Radio Programmers |
    | `StaffRadio` | Radio Staff (base role, given to everyone) |
    | `UploaderRadio` | Radio Uploader |
    | `Streamers` | Streamers |
    | `AccesAuxStatus` | Status Access |

    ### Full access table by page

    | Page | Groups with access |
    |---|---|
    | Home | Everyone (Radio Staff is enough) |
    | Media Library | Administrators, Media Library Access |
    | Uploaded Audio Files | Administrators, Radio Uploader |
    | Playlists | Administrators, Playlist Management |
    | Schedule | Administrators, Radio Programmers |
    | On-air Assets | Administrators, Radio Programmers, Streamers |
    | Music Validation | Administrators **only** |
    | Streamers | Administrators, Streamers |
    | Debug API | Administrators **only** |
    | Cache | Administrators **only** |

    **If your account only has the base role** (Radio Staff, no other group), the Home page shows only a neutral welcome message, with no widget or control at all — that's expected, not a loading error.

    **A special group, "Status Access"**, grants only the right to see the streaming server's status panel on the home page (version, memory, current live session…) read-only, without the other widgets or the admin-only Skip control.

    **Finer checks exist inside some pages** beyond page-level access: for instance on "Uploaded Audio Files", a Radio Uploader account (non-admin) can upload but will **never** see the Edit/Delete buttons, nor the category picker — these controls are reserved to administrators and simply don't appear on screen (they're not greyed out with an explanation, they're absent).

    ---

    ## 5. Home

    Route: `/dashboard`.

    ### If your account only has the base role

    You see only: *"Bienvenue sur FluffRadio. Aucune section supplémentaire n'est associée à votre compte."* ("Welcome to FluffRadio. No additional section is associated with your account.") Nothing else to do on this page.

    ### If your account has a fuller role

    You see, in this order:

    **1. A grid of shortcut cards** (one per area):
    - **"Fichiers audio"** (Audio Files) — *"Uploader, éditer et gérer la bibliothèque audio."* ("Upload, edit and manage the audio library.") — a **+** button takes you straight to the Uploaded Audio Files page.
    - **"Playlists"** — while your playlists are loading: *"Chargement des playlists..."* ("Loading playlists..."); if you have none: *"Organiser les séquences musicales de diffusion."* ("Organize the music broadcast sequences."); otherwise, a clickable list of your **first 5 playlists** with their track count in parentheses (e.g. "Sélection du vendredi soir (12 pistes)") — clicking one takes you straight to that playlist on the Playlists page. A **+** button leads to the Playlists page in general.
    - **"Programmations"** (Schedule) — *"Préparer les contenus à diffuser par créneau."* ("Prepare content to broadcast per slot.") — **+** button to the Schedule page.
    - **"Cache"** — *"Inspecter et mettre à jour le cache des données."* ("Inspect and update the data cache.") — **+** button to the Cache page.

    **2. The streaming server status panel** (also visible to the "Status Access" group) — see the detailed description in chapter 12 ("AwooStatusPanel"): the server's version and uptime, live status, the currently playing track, a chart of memory usage over the last 5 minutes, and (administrators only) a **"Passer"** ("Skip") button to skip the current automatic track.

    **3. An explicit banner**: *"Section legacy (Icecast/Liquidsoap) — nécessite `ICECAST_STATUS_URL` / `LIQUIDSOAP_STATUS_URL`, non configurées actuellement."* ("Legacy section (Icecast/Liquidsoap) — requires `ICECAST_STATUS_URL` / `LIQUIDSOAP_STATUS_URL`, not currently configured.") — this tells you the section below shows **fallback/simulated data**, not real statistics (the real streaming status is the panel above, not this one).

    **4. The "Streaming Manager (Icecast + Liquidsoap)" panel** (legacy, safe to ignore for everyday use):
    - an **"On Air"** / **"Off Air"** badge;
    - four buttons: **Start**, **Stop**, **Skip**, **Reload** — they send a command, but until the technical variables above are configured, their real-world effect is limited/simulated;
    - a "now playing" block (track, artist, bitrate, peak listeners);
    - **Listeners**, **Bandwidth** (estimated), **Storage** (disk space used/total) counters;
    - a **"Recently played"** list;
    - a **"Listeners trend"** bar chart.

    > In short: to know the real broadcast status, look at the top panel (AwooStatusPanel/LIVE STREAM); the bottom block is an older technical dashboard not wired to the current infrastructure.

