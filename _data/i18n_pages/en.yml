    ## 15. Glossary

    | Term | Meaning |
    |---|---|
    | **Animator** ("animateur") | A technical account carrying the connection credentials to broadcast live (distinct from a panel login account, even though it often shares the same name) |
    | **Media library category** ("catégorie de médiathèque") | Music / Jingles / Podcasts / Ads / VOD / Other — determines where a file shows up and its required fields |
    | **Slot** ("créneau") | A schedule entry: day/time, duration, content type, priority |
    | **Live / ingest** ("direct" / "ingest") | The active technical connection while an animator is broadcasting live |
    | **RTMP ingest** | One of the two supported live-broadcast protocols; credentials come as Server + Stream key |
    | **SRT ingest** | The other supported protocol; arms itself automatically 10 minutes before a scheduled slot |
    | **Priority** ("priorité") | A 0–100 number that determines which slot wins when times overlap |
    | **Fallback** ("repli") | The playlist that plays when nothing is scheduled at a given moment |
    | **SACEM** | The French copyright collection society — every music track must carry a reference to its registry |
    | **Validated** ("validé") | The status of a music track confirmed by an administrator, the only condition for it to be usable in Schedule/Playlists/Media Library |
    | **VOD / Rerun** ("VOD / Rediffusion") | The media library category for content meant to be replayed (show reruns) |

    ---

    ## 16. FAQ / Troubleshooting

    **I uploaded a file but I don't see it in the list.**
    Did you click "Actualiser" (Refresh) after uploading? The list never reloads itself after an upload.

    **My uploaded track doesn't show up in Schedule / Playlists / Media Library.**
    A music track must first be **validated** by an administrator (Music Validation page) before it's usable elsewhere. This only applies to the Music category — other categories are usable right after upload.

    **I can't save my schedule, an "overlap" message appears.**
    Two active slots have the exact same priority and overlap in time. Change one of their priorities, or disable one (uncheck "Actif").

    **I saved my schedule but nothing changed on air.**
    A save can take up to 30 minutes before the streaming server picks it up — that's normal, wait it out.

    **The "Upload" button stays greyed out.**
    At least one required field is missing on at least one queued file — the exact list of missing fields is shown under each affected file.

    **I can't find the button to edit/delete a track.**
    These buttons are only visible to administrator accounts. If your role is plain Radio Uploader, you'll never see them — that's not an error.

    **I just started a live session but it shows "not connected yet".**
    That's normal right after starting: the streaming software's actual connection takes a few seconds. If it persists more than a minute, check your streaming software's (OBS, etc.) configuration against the credentials shown in the "Secrets" window.

    **A message says "Ingest already in place" when I try to start.**
    That's not an error: the connection is already open, no need to click again. The already-active URL is simply given back to you.

    **I lost my animator's connection credentials.**
    If the live session is currently active, open the "Secrets" window: the URL currently in use is shown there and copyable. Otherwise, only an administrator can give them back to you (or regenerate them, which invalidates the old ones).

    **I get a "session expired or unauthorized" error.**
    Sign out then sign back in.

    **I get a persistent "internal backend server error".**
    This isn't something you can fix yourself — tell an administrator or developer, with the exact message shown.

    **Why doesn't the "Cache" page show an actual cache?**
    That's a known quirk of the tool: this page actually shows a network request log, useful for technical diagnostics. The menu name just hasn't been updated to match.
