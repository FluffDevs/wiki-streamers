    ## 6. Media Library (Médiathèque)

    Route: `/dashboard/mediatheque`. Access: Administrators, Media Library Access.

    This page is for **browsing and listening only** to the already-validated music catalog — you can't upload or edit anything here (for that, see "Uploaded Audio Files" and "Music Validation").

    ### What you see

    - A search box.
    - A **"Grouper par"** ("Group by") selector with four choices: **Artiste** (Artist), **Album**, **Genre**, **Année** (Year). Tracks are organized into collapsible/expandable groups accordingly (each group has a small arrow to click to open/close it).
    - Additional filters (genre, language).
    - Every track has its own inline playback controls right in the list (play/pause, previous/next, volume), without opening a separate window.
    - An **"E"** badge appears next to a track's title if it's marked as explicit content.

    ### What you can't do here

    Upload a file, edit metadata, delete a track: those actions happen from "Uploaded Audio Files" (for admins and Radio Uploader) or "Music Validation" (admins).

    ---

    ## 7. Uploaded Audio Files (Fichiers audio téléchargés)

    Route: `/dashboard/fichiers-audio`. Access: Administrators, Radio Uploader.

    This page has two parts: an upload block at the top, and the catalog list below.

    ### 7.1 Uploading one or more files

    **Step 1 — select files.** A drop zone reading *"Déposer des fichiers audio ici ou cliquer pour sélectionner"* ("Drop audio files here or click to select"), with the note *"Sélection multiple · MP3, WAV, OGG, M4A, vidéo (podcasts) · max 25 fichiers"* ("Multiple selection · MP3, WAV, OGG, M4A, video (podcasts) · max 25 files"). You can:
    - drag and drop one or several files directly into the zone;
    - or click it to open your computer's file picker (accepts audio and video formats).

    A counter at the bottom of the zone shows how many slots remain (*"X/25 fichiers sélectionnés · Y places restantes"*), or *"Limite atteinte : 25/25 fichiers sélectionnés"* ("Limit reached: 25/25 files selected") if you're at the max. If you try adding more than the limit: *"Limite atteinte : vous ne pouvez pas ajouter plus de 25 fichiers."* (or, if some still go through: *"Limite atteinte : seuls les 25 premiers fichiers seront pris en compte."*).

    **Step 2 — the upload rules (mandatory, once per browser).** The **very first time** you open this page (or as long as you haven't ticked "remember"), a window opens and **blocks the rest of the page** while it's open:
    - Title: *"Règlement d'upload des titres"* ("Track upload rules").
    - Text: *"Avant d'uploader des fichiers, merci de lire le règlement ci-dessous. Il détaille les règles à respecter pour les métadonnées, les droits et la qualité des titres soumis."* ("Before uploading files, please read the rules below. They detail the rules to follow for metadata, rights, and the quality of submitted tracks.")
    - **"Ouvrir le règlement (PDF)"** ("Open the rules (PDF)") button: opens the official PDF document in a new tab.
    - Until you click this button, you see: *"Ouvrez le règlement pour débloquer la case de confirmation ci-dessous."* ("Open the rules to unlock the confirmation checkbox below.") — and the checkbox below stays **greyed out, impossible to check**.
    - Once the PDF has been opened (even if you don't read it all), the message becomes: *"✓ Règlement ouvert : vous pouvez confirmer sa lecture ci-dessous."* ("✓ Rules opened: you can now confirm you've read them below."), and the checkbox unlocks.
    - Checkbox 1: **"J'ai bien lu et compris le règlement"** ("I have read and understood the rules") — must be checked to continue.
    - Checkbox 2 (optional): **"Se souvenir de mon choix et ne plus afficher ce message"** ("Remember my choice and don't show this message again") — if checked, the window won't reappear on this browser (this is remembered locally on your computer/browser, not on your account — if you switch computer or browser, it will reappear).
    - **"Fermer"** ("Close") button: stays disabled until checkbox 1 is checked.

    **Step 3 — each file's fields.** For every added file, a card appears with:
    - the filename and its size (in KB or MB);
    - a status: "En attente" (Pending), "Upload..." (with an individual progress ring), "Réussi" (Success, green checkmark), or "Erreur" (Error, red cross, with the error message shown right below);
    - fields auto-filled whenever possible:
      - **Titre** (Title) and **Artiste** (Artist): guessed from the file's embedded tags (ID3), or from the filename if formatted "Artist - Title.mp3" (otherwise, just the filename is used as the title);
      - **Album**, **Année** (Year), **Genre**: guessed from ID3 tags if present;
      - **Point de départ** (Cue-in): always pre-filled to `0`;
      - **Point de fin** (Cue-out): automatically pre-filled to the file's detected total duration.
    - **Title field*** (required, for all file types).
    - **Artist field*** (required, for all file types).
    - **Category field**:
      - If you're a plain **Radio Uploader** account (non-admin): this field doesn't appear at all, a fixed field shows just "Musiques" — you can only upload music.
      - If you're an **administrator** (or any account with category-picking rights): a dropdown offers **Musiques** (Music), **Jingles / habillage** (Jingles), **Podcasts / préenregistrés** (Podcasts), **Promos / publicités** (Ads), **VOD / Rediffusions** (VOD/Reruns), **Autres** (Other). If you pick anything other than "Musiques", a note appears: *"Rangé dans la médiathèque « [category] », pas dans les musiques."* ("Filed under « [category] » in the media library, not under music.")
    - **Genre field**: required (marked with an asterisk) only if the category is "Musiques"; optional otherwise (the label then reads "Genre (facultatif)" — "Genre (optional)"). Filled via a dedicated genre picker (searchable dropdown of normalized genres, or free text for a custom genre).
    - **Album field***: appears **only** for the "Musiques" category, and is required there.
    - **Year field**: required for "Musiques", optional otherwise.
    - **Language field**: required for "Musiques" (dropdown of normalized languages; picking "Autre"/"Other" reveals a free-text field), optional otherwise.
    - **SACEM registry field***: appears **only** for the "Musiques" category, and is required there. Next to the label, two links: **"Rechercher ce titre ↗"** ("Search this title ↗") (opens a pre-filled search on the SACEM website using the title and artist already entered) and **"Répertoire SACEM ↗"** ("SACEM repertoire ↗") (opens SACEM's general repertoire).
    - **"Contenu explicite"** ("Explicit content") checkbox (always optional, regardless of category).
    - **"Contenu furry"** ("Furry content") checkbox (always optional, regardless of category — a site-specific tag).
    - **Point de départ (s)*** (Cue-in, seconds) and **Point de fin (s)*** (Cue-out, seconds): always required, in seconds, regardless of category.
    - If required fields are missing for a file, a red message appears right under its card: *"Champs obligatoires manquants : [list of fields]."* ("Missing required fields: [list].")
    - A **"Retirer"** ("Remove") button (trash icon) removes this file from the queue before upload (unavailable while this specific file's upload is in progress).

    **Step 4 — starting the upload.** The **"Uploader N fichier(s)"** ("Upload N file(s)") button at the bottom:
    - stays **disabled** as long as any file in the list is missing a required field (hovering over it shows: *"Complète tous les champs obligatoires avant d'uploader"* — "Fill in all required fields before uploading");
    - while sending, shows *"Upload en cours..."* ("Upload in progress...") with a spinning icon, and an **overall progress bar** (percentage, weighted by file size) appears above the list.

    **Step 5 — after the upload.** Once every file has been sent successfully, the queue clears itself automatically and a message appears at the top of the page: *"N fichier(s) uploadé(s). Cliquez sur « Actualiser » pour les afficher."* ("N file(s) uploaded. Click « Refresh » to display them.") — **the upload does not automatically refresh the catalog list below**, you must explicitly click the **"Actualiser"** ("Refresh") button.

    **"Vider"** ("Clear") button: removes every file currently queued (before sending), without uploading anything.

    ### 7.2 Managing the existing catalog

    Below the upload block:
    - A search box: *"Rechercher par titre ou artiste..."* ("Search by title or artist...").
    - A **"Actualiser"** ("Refresh") button (with a refresh icon) reloads the full list from the server.
    - Every track shows: a music-note icon, its title, its artist ("Artiste inconnu" — "Unknown artist" — if missing), its duration, its upload date.
    - Buttons per track:
      - **Play / Stop** (round icon): plays the track directly in a player that appears above the list, with a dedicated Stop button.
      - **Modifier** (Edit, pencil icon, administrators only): opens an edit window (see below).
      - **Supprimer** (Delete, trash icon, administrators only): asks for confirmation (*"Confirmer la suppression ?"* — "Confirm deletion?") then **permanently** deletes the track.
    - At the bottom: pagination controls (tracks per page, navigation).

    ### 7.3 The "Corriger les métadonnées" (Fix metadata) window

    Opened via the Edit button (administrators only). Contains:
    - A play/stop button right in the window's header.
    - **Titre** (Title) (free text).
    - **Artiste** (Artist).
    - **Album** (optional).
    - **Genre** (dedicated picker).
    - **Année** (Year, optional, digits only).
    - **Durée** (Duration): shown read-only, not editable (computed automatically from the file).
    - **Langue** (Language) (dropdown + custom field if "Autre"/"Other").
    - **Contenu explicite** (Explicit content) checkbox, **Contenu furry** (Furry content) checkbox.
    - **Registre SACEM** (SACEM registry) (with the same SACEM help links as on upload).
    - **Point de départ (s)** (Cue-in) and **Point de fin (s)** (Cue-out).
    - The track's technical ID is shown at the bottom of the window ("ID : ...") — useful if you need to report a specific issue to an administrator.
    - **"Annuler"** (Cancel) button: closes without saving anything.
    - **"Sauvegarder"** (Save) button: stays disabled until at least one field has actually been changed; on success, shows *"Métadonnées mises à jour avec succès."* ("Metadata successfully updated.") and closes the window.

    **Validations applied before saving** (a red message shows and nothing is sent if any fails):
    - Year: must be a number if provided (*"Année invalide : entrez une valeur numérique."* — "Invalid year: enter a numeric value.").
    - Cue-in / cue-out: must be numbers (seconds), with or without decimals (*"Point de départ invalide : entrez uniquement des chiffres (secondes, >= 0)."* — same for cue-out).
    - Cue-out must be strictly greater than cue-in (*"Le point de fin doit être supérieur au point de départ."*).
    - Neither can exceed the track's actual duration (*"Le point de fin ne peut pas dépasser la durée de la piste ([duration])."*).
    - If nothing changed: *"Aucune modification détectée."* ("No changes detected.") (the Save button is disabled in that case anyway).

    **Important**: editing a track's metadata **never changes its validation status** — an already-validated track stays validated after an admin edits it (the status is explicitly preserved behind the scenes).

    ### 7.4 Possible error messages

    Every action on this page (loading, upload, delete, save) can show an explicit error message on failure, in this general form: *"[Action] : [session expirée ou non autorisée / accès refusé / introuvable côté serveur / erreur interne du serveur backend] — [detail]."* ("[Action]: [session expired or unauthorized / access denied / not found server-side / internal backend server error] — [detail].") If you see "session expirée ou non autorisée" ("session expired or unauthorized"), sign out then sign back in; for other cases, contact an administrator if the problem persists.

