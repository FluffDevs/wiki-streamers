    ## 12. Streamers (animators & live control)

    Route: `/dashboard/streamers`. Access: Administrators, Streamers.

    This page has up to three blocks depending on your role: the animator list (admin), your own profile (if you are yourself an animator), and live control (visible to everyone with access to the page).

    ### 12.1 "Animateurs" (Animators) block (administrators only)

    A table of every existing animator account, with these columns: **Identifiant** (Username), **Titre à l'antenne** (On-air title), **Dernier direct** (Last live session), **Secrets rotés le** (Secrets last rotated on). A red warning badge appears in front of the username of any **disabled** account.

    Actions per row:
    - **Éditer** (Edit): opens the full profile for editing.
    - **Key icon**: opens the connection secrets window directly (see §12.4).
    - **Direct** (Live): pre-selects this animator in the "Direct" panel further down the same page.

    Note under the table: *"La liste ne porte pas les modes / l'état « désactivé » : ils s'affichent en ouvrant la fiche (qui renvoie aussi les secrets)."* ("The list doesn't carry the modes / the « disabled » state: they show up when opening the profile, which also returns the secrets.")

    **"Nouvel animateur"** ("New animator") button opens a creation window:
    - **Compte Cognito** (Cognito account): if accounts exist in the Streamers or Administrators group and aren't already animators, a dropdown offers them (with email and name if known); help text: *"L'identifiant animateur doit être exactement le nom d'utilisateur Cognito pour que l'animateur puisse gérer son propre direct."* ("The animator ID must be exactly the Cognito username for the animator to manage their own live session.") If no account is available (all already animators, or no account in these groups, or the list couldn't load), a free-text field appears instead, with the requirement: 32 characters max, letters/digits/hyphen/underscore only.
    - **Modes autorisés** (Allowed modes): **SRT** and **RTMP** checkboxes (at least one must be checked).
    - **Chiffrement SRT** (SRT encryption): dropdown (None, AES-128, AES-192, AES-256).
    - **Fin de direct** (End of live): dropdown with four choices — *"Coupé à la fin du créneau"* ("Cut at the end of the slot"), *"5 min de rab puis coupé"* ("5 extra minutes then cut"), *"15 min de rab puis coupé"* ("15 extra minutes then cut"), *"Jamais coupé automatiquement"* ("Never automatically cut").
    - **Titre à l'antenne** (On-air title) (optional).
    - **"Autoriser un direct hors créneau"** ("Allow a live session outside the scheduled slot") checkbox.
    - **"Compte désactivé"** ("Disabled account") checkbox.
    - **Annuler** (Cancel) / **Enregistrer** (Save) buttons.

    After creating or editing, a banner confirms: *"Animateur créé."* ("Animator created.") or *"Animateur mis à jour."* ("Animator updated.")

    ### 12.2 "Ma fiche animateur" (My animator profile) block

    Visible to **everyone**, including administrators (an administrator can be an animator themselves without necessarily having the Streamers group).

    - If you have an animator profile: it shows your username, your allowed modes, your SRT encryption level, your end-of-live policy, whether you can broadcast outside your slot, and a clickable line "Secrets — changé le [date] — voir" ("Secrets — changed on [date] — view") that opens the secrets window.
    - If you don't have one (and you're not an admin): *"Aucune fiche animateur rattachée à « [your name] ». Demande à un admin de la créer."* ("No animator profile linked to « [your name] ». Ask an admin to create one.")
    - If access to your profile is explicitly denied (e.g. disabled account): the exact error message returned by the server is shown.

    ### 12.3 "Direct" (Live) block

    Constantly shows (refreshed every 5 seconds):
    - **"À l'antenne : "** ("On air: ") the name of the animator currently live, or "— personne —" ("— nobody —"), with the note "(connecté)" ("(connected)") or "(pas encore connecté)" ("(not connected yet)").
    - The **mode** (SRT or RTMP) and the encryption if SRT.
    - If RTMP: the URL is split into two separately copyable lines — **"Serveur"** (Server) and **"Clé de flux"** (Stream key) (each with a **Copier** — Copy — button, which reads "Copié !" — "Copied!" — briefly after clicking) — this is the format expected by software like OBS.
    - If SRT (or another URL format): a single copyable **"URL d'ingest"** (Ingest URL) line.
    - The current animator's stream title and end-of-live policy, if known.
    - If the streaming server itself reports a problem: a red banner with the exact technical message.

    **Start/stop form** (visible if you're an admin, or if you have your own animator profile):
    - **Animateur** (Animator): dropdown (admin) or a fixed field with your own name (non-admin).
    - **Mode**: SRT or RTMP (the modes offered depend on what the chosen animator is allowed to use).
    - **Chiffrement (session, non enregistré)** (Encryption, session-only, not saved): SRT mode only — lets you force a different encryption level than the one stored on the profile, just for this session, without changing the profile.
    - **Titre à l'antenne (optionnel)** (On-air title, optional): if empty, the scheduled slot's title is used instead.
    - **Forcer (couper l'autre)** (Force — cut the other one): checkbox, **administrators only** — lets you take over an ingest already opened by someone else.

    Buttons: **Arrêter** (Stop, always visible) and **Démarrer / armer** (Start / arm, visible only if you have the right to act on this animator).

    **An important technical distinction to know (stated in a footnote)**:
    > *"SRT : l'ingest ne s'arme jamais en avance — il s'arme automatiquement 10 minutes avant le début du créneau, jamais avant. Rien à cliquer : « Démarrer » ne fait que récupérer l'URL déjà ouverte. RTMP : rien n'est pré-armé, il faut « Démarrer » soi-même. Ne relance pas si la réponse dit « déjà en place ». « connecté » faux juste après un démarrage n'est pas un échec."*
    > ("SRT: the ingest never arms itself early — it arms automatically 10 minutes before the slot starts, never before. Nothing to click: « Start » only retrieves the already-open URL. RTMP: nothing is pre-armed, you have to « Start » it yourself. Don't re-trigger it if the response says « already in place ». « connected » being false right after a start is not a failure.")

    In plain terms:
    - In **SRT**, the system itself opens the connection 10 minutes before the slot's scheduled time — clicking "Démarrer / armer" then only **retrieves** the already-generated URL, you're not the one triggering the opening.
    - In **RTMP**, nothing opens automatically: it's on you to click "Démarrer / armer" at the right moment.
    - A *"Ingest déjà en place — ne relance pas le démarrage, l'URL existante est renvoyée"* ("Ingest already in place — don't re-trigger the start, the existing URL is returned") message is not an error — no need to click again.
    - Seeing "(pas encore connecté)" or "connecté" showing false right after starting is **normal**: the actual connection (the streaming software actually plugging in) takes a few seconds.
    - If the ingest is already held by someone else: *"Ingest déjà ouvert pour [name]."* ("Ingest already open for [name]."), followed by *"Coche « Forcer » pour reprendre l'antenne."* ("Check « Force » to take back the air.") (admin) or *"Un admin peut forcer."* ("An admin can force it.") (non-admin).

    ### 12.4 The "Secrets" window

    Opened from the key icon (admin list) or from "Ma fiche animateur".

    - Permanent warning: *"Ne les partage pas, ne les mets pas dans une URL publique. Régénérer coupe la validité des URL d'ingest ; si l'animateur est à l'antenne, il faudra ré-armer son direct (force, admin)."* ("Don't share them, don't put them in a public URL. Regenerating invalidates the ingest URLs; if the animator is currently on air, an admin will need to re-arm their live session using force.")
    - If the animator in question is **currently live**, an extra banner shows the URL (or Server+Key) **currently in use**, copyable — this is the only way to retrieve it if you've lost it while the live session is active.
    - **Secret SRT** and **Secret RTMP**: shown read-only (clicking the field selects all its text to make copying easier), each with its own Copy button. Technical note at the bottom: *"Les secrets seuls ne suffisent pas à se connecter : l'URL complète (port compris) n'existe que pendant une session active — elle s'affiche ci-dessus quand [animator] est à l'antenne, ou dans le panneau « Direct » après un « Démarrer / armer »."* ("The secrets alone aren't enough to connect: the full URL (port included) only exists during an active session — it's shown above when [animator] is on air, or in the « Direct » panel after a « Start / arm ».")
    - **"Fermer"** (Close) button.
    - **"Régénérer"** (Regenerate) button (red, dangerous): rotates **both secrets at once**. There's only an implicit confirmation via the warning shown — **there is no second confirmation window**, only click it if you're sure. Once regenerated, the old credentials stop working **immediately**, even if the animator was mid-broadcast (an administrator will need to restart their live session using "Force").

